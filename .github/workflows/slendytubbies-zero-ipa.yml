
name: Slendytubbies Zero - Fix 1 Metal Watchdog

on:
  workflow_dispatch:
    inputs:
      prepared_run:
        description: "Successful Zero V1 run ID (optional)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 150

    env:
      GH_TOKEN: ${{ github.token }}
      PREPARED_RUN: ${{ inputs.prepared_run }}
      UNITY_VERSION: 2022.3.58f1
      UNITY_EDITOR_PATH: /Applications/Unity/Unity.app/Contents/MacOS/Unity
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - uses: actions/checkout@v5

      - name: Prepare folders
        run: |
          mkdir -p incoming logs dist

          df -h

      - name: Reuse successful Zero V1 project
        run: |
          set -euo pipefail

          RUN="$PREPARED_RUN"

          if [ -z "$RUN" ]; then

            RUN=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?name=Zero-Prepared-V1&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')

          fi

          test -n "$RUN"

          echo "Using prepared run: $RUN"

          gh run download "$RUN" \
            --name Zero-Prepared-V1 \
            --dir incoming

          test -s incoming/Zero-Prepared-V1.tar.gz

          tar -xzf incoming/Zero-Prepared-V1.tar.gz

          rm incoming/Zero-Prepared-V1.tar.gz

          test -d ExportedProject/Assets

          test -s ExportedProject/Assets/Editor/BuildZero.cs

          test -s ExportedProject/ProjectSettings/GraphicsSettings.asset

          grep -F '2022.3.58f1' \
            ExportedProject/ProjectSettings/ProjectVersion.txt

          echo "Original prepared project loaded"

          echo "No new Recovery"

          echo "No new DLL patch"

      - name: Verify original campaign
        run: |
          set -euo pipefail

          PROJECT=ExportedProject

          test -s "$PROJECT/Assets/Scenes/InitialSetup.unity"

          test -s "$PROJECT/Assets/Scenes/MainMenu/MainMenu.unity"

          test -s "$PROJECT/Assets/Scenes/Epilogue.unity"

          test -s "$PROJECT/ProjectSettings/EditorBuildSettings.asset"

          find "$PROJECT/Assets" \
            -name '*.unity' \
            | sort | tee logs/scenes.txt

          DLL=$(find "$PROJECT/Assets" \
            -name ZeroOriginalGame.dll \
            -print -quit)

          test -s "$DLL"

          test -s "$DLL.meta"

          MOBILE=$(find "$PROJECT/Assets" \
            -name ZeroMobile.dll \
            -print -quit)

          test -s "$MOBILE"

          echo "Original campaign DLL verified"

          echo "Mobile controls preserved"

          echo "Scenes: $(wc -l < logs/scenes.txt)"

      - name: Fix Metal shader startup watchdog
        run: |
          set -euo pipefail

          python3 - <<'PY' | tee logs/shader-fix.txt
          from pathlib import Path
          import re

          path = Path(
              "ExportedProject/ProjectSettings/GraphicsSettings.asset"
          )

          text = path.read_text()

          Path(
              "logs/GraphicsSettings-before.asset"
          ).write_text(text)

          print("ZERO FIX 1")
          print("Crash: 0x8BADF00D")
          print("Watchdog: scene-create")
          print("Startup time allowance: 18.90 seconds")
          print("Blocking operation: WarmupPreloadedShaders")

          preload = re.search(
              r"(?m)^([ \t]*)m_PreloadedShaders:",
              text
          )

          if not preload:
              raise RuntimeError(
                  "Original shader settings not found"
              )

          pattern = re.compile(
              r"(?m)^([ \t]*)m_PreloadShadersBatchTimeLimit:"
              r"[ \t]*([^\r\n]*)$"
          )

          previous = pattern.search(text)

          if previous:

              print(
                  "Previous shader preload limit:",
                  previous.group(2)
              )

              text = pattern.sub(
                  lambda m:
                      m.group(1) +
                      "m_PreloadShadersBatchTimeLimit: 2",
                  text
              )

          else:

              indent = preload.group(1)

              text = (
                  text.rstrip() +
                  "\n" +
                  indent +
                  "m_PreloadShadersBatchTimeLimit: 2\n"
              )

          path.write_text(text)

          updated = path.read_text()

          assert re.search(
              r"(?m)^\s*m_PreloadShadersBatchTimeLimit:"
              r"\s*2\s*$",
              updated
          )

          assert "m_PreloadedShaders:" in updated

          Path(
              "logs/GraphicsSettings-after.asset"
          ).write_text(updated)

          print("New shader preload limit: 2 ms")

          print("Shader prewarming deferred")

          print("Original shader collections preserved")

          print("Original materials preserved")

          print("Original scenes preserved")

          print("METAL WATCHDOG FIX APPLIED")
          PY

      - name: Update Fix 1 build number
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "ExportedProject/Assets/Editor/BuildZero.cs"
          )

          text = path.read_text()

          text, count = re.subn(
              r'(PlayerSettings\.iOS\.buildNumber\s*=\s*)"[^"]*";',
              r'\g<1>"2";',
              text
          )

          if count != 1:
              raise RuntimeError(
                  "Unexpected original builder"
              )

          path.write_text(text)

          print("Original game version: 1.1.0")

          print("iOS Fix 1 build number: 2")

          print("Original bundle identifier preserved")
          PY

      - name: Install Unity 2022.3.58f1
        timeout-minutes: 40
        run: |
          set -euo pipefail

          BASE=https://download.unity3d.com/download_unity/ed7f6eacb62e

          curl -fLsS --retry 3 \
            "$BASE/MacEditorInstallerArm64/Unity-2022.3.58f1.pkg" \
            -o "$RUNNER_TEMP/unity.pkg"

          sudo installer \
            -pkg "$RUNNER_TEMP/unity.pkg" \
            -target /

          rm "$RUNNER_TEMP/unity.pkg"

          curl -fLsS --retry 3 \
            "$BASE/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-2022.3.58f1.pkg" \
            -o "$RUNNER_TEMP/ios.pkg"

          sudo installer \
            -pkg "$RUNNER_TEMP/ios.pkg" \
            -target /

          rm "$RUNNER_TEMP/ios.pkg"

          test -x "$UNITY_EDITOR_PATH"

          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Unity CLI
        run: |
          npm install -g \
            @rage-against-the-pixel/unity-cli@4.2.2

      - name: Activate Unity Personal
        id: activate
        timeout-minutes: 10
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME || secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail

          unity-cli activate-license \
            --license personal

      - name: Export original campaign with Metal fix
        timeout-minutes: 75
        run: |
          set -euo pipefail

          export ZERO_XCODE="$PWD/Xcode"

          LOG="$PWD/logs/unity.log"

          touch "$LOG"

          tail -n +1 -F "$LOG" &

          PID=$!

          trap 'kill "$PID" 2>/dev/null || true' EXIT

          if ! "$UNITY_EDITOR_PATH" \
            -quit \
            -batchmode \
            -nographics \
            -buildTarget iOS \
            -projectPath "$PWD/ExportedProject" \
            -executeMethod BuildZero.Run \
            -logFile "$LOG"; then

            echo "UNITY EXPORT FAILED"

            grep -Ei \
              'error|exception|failed|missing' \
              "$LOG" | tail -100 || true

            exit 1

          fi

          test -s Xcode/Unity-iPhone.xcodeproj/project.pbxproj

          echo "UNITY EXPORT SUCCESS"

      - name: Return Unity license
        if: always() && steps.activate.outcome == 'success'
        continue-on-error: true
        run: |
          unity-cli return-license \
            --license personal \
            --when auto

      - name: Verify shader fix after Unity export
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(
              "ExportedProject/ProjectSettings/GraphicsSettings.asset"
          )

          text = path.read_text()

          if not re.search(
              r"(?m)^\s*m_PreloadShadersBatchTimeLimit:"
              r"\s*2\s*$",
              text
          ):
              raise RuntimeError(
                  "Unity did not preserve shader fix"
              )

          print("Graphics settings confirmed")

          print("Deferred shader preload: 2 ms")

          print("Ready for ARM64 build")
          PY

      - name: Build ARM64 application
        timeout-minutes: 45
        run: |
          set -euo pipefail

          xcodebuild \
            -project Xcode/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            build 2>&1 | tee logs/xcode.log

      - name: Create Zero Fix 1 IPA
        run: |
          set -euo pipefail

          APP=$(find \
            "$PWD/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            -print -quit)

          test -d "$APP"

          EXE=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$APP/Info.plist")

          lipo "$APP/$EXE" \
            -verify_arch arm64

          /usr/libexec/PlistBuddy \
            -c 'Set :CFBundleVersion 2' \
            "$APP/Info.plist"

          for KEY in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do

            /usr/libexec/PlistBuddy \
              -c "Set :$KEY true" \
              "$APP/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy \
              -c "Add :$KEY bool true" \
              "$APP/Info.plist"

          done

          STAGE=$(mktemp -d)

          mkdir -p "$STAGE/Payload"

          ditto "$APP" \
            "$STAGE/Payload/SlendytubbiesZero.app"

          ditto -c -k --norsrc --keepParent \
            "$STAGE/Payload" \
            "$PWD/dist/Slendytubbies-Zero-1.1.0-Fix1.ipa"

          unzip -tq \
            dist/Slendytubbies-Zero-1.1.0-Fix1.ipa

          test -s dist/Slendytubbies-Zero-1.1.0-Fix1.ipa

          rm -rf "$STAGE"

          ls -lh dist/

          echo "ZERO FIX 1 IPA CREATED"

      - name: Upload Zero Fix 1 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Slendytubbies-Zero-iOS-Fix1
          path: dist/*.ipa
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Fix1-Logs
          path: logs/
          retention-days: 14
          if-no-files-found: warn

      - name: Final summary
        if: always()
        run: |
          {
            echo "# Slendytubbies Zero Fix 1"
            echo ""
            echo "Original game: 1.1.0"
            echo "iOS build: 2"
            echo "Unity: 2022.3.58f1"
            echo "Architecture: ARM64"
            echo ""
            echo "Targeted crash: 0x8BADF00D"
            echo "Deferred shader prewarming: 2 ms"
            echo "Original shader collections preserved"
            echo "Original campaign preserved"
            echo "Original mobile controls preserved"
            echo "No new Recovery"
            echo ""

            if [ -s dist/Slendytubbies-Zero-1.1.0-Fix1.ipa ]; then

              echo "FIX 1 IPA CREATED"
              ls -lh dist/

            else

              echo "BUILD NOT COMPLETED"

            fi

            echo ""
            echo "Device testing required"

          } >> "$GITHUB_STEP_SUMMARY"
