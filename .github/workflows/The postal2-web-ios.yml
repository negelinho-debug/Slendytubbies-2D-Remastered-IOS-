
name: POSTAL 2 iOS - V6 ONLINE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Install build tools
        run: |
          brew install xcodegen
          mkdir -p App

      - name: Create iOS project
        run: |
          cat > project.yml <<'EOF'
          name: Postal2
          options:
            deploymentTarget:
              iOS: "16.0"
          targets:
            Postal2:
              type: application
              platform: iOS
              sources:
                - App
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: POSTAL 2
                  CFBundleShortVersionString: "6.0"
                  CFBundleVersion: "6"
                  UILaunchScreen: {}
                  UIRequiresFullScreen: true
                  UIViewControllerBasedStatusBarAppearance: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.projectparadise.postal2
                  CODE_SIGNING_ALLOWED: NO
                  TARGETED_DEVICE_FAMILY: "1"
                  CLANG_ENABLE_OBJC_ARC: YES
              dependencies:
                - sdk: WebKit.framework
          EOF

          cat > App/main.m <<'EOF'
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>

          @interface GameController : UIViewController
          <WKNavigationDelegate>

          @property(nonatomic,strong) WKWebView *web;
          @property(nonatomic,strong) UIButton *retry;

          @end

          @implementation GameController

          - (BOOL)prefersStatusBarHidden {
            return YES;
          }

          - (BOOL)prefersHomeIndicatorAutoHidden {
            return YES;
          }

          - (UIInterfaceOrientationMask)supportedInterfaceOrientations {
            return UIInterfaceOrientationMaskLandscape;
          }

          - (void)viewDidLoad {
            [super viewDidLoad];

            self.view.backgroundColor = UIColor.blackColor;

            WKWebViewConfiguration *config =
              [[WKWebViewConfiguration alloc] init];

            config.websiteDataStore =
              [WKWebsiteDataStore defaultDataStore];

            config.defaultWebpagePreferences
              .allowsContentJavaScript = YES;

            config.allowsInlineMediaPlayback = YES;

            config.mediaTypesRequiringUserActionForPlayback =
              WKAudiovisualMediaTypeNone;

            self.web = [[WKWebView alloc]
              initWithFrame:self.view.bounds
              configuration:config];

            self.web.navigationDelegate = self;

            self.web.autoresizingMask =
              UIViewAutoresizingFlexibleWidth |
              UIViewAutoresizingFlexibleHeight;

            self.web.backgroundColor = UIColor.blackColor;
            self.web.opaque = NO;
            self.web.scrollView.bounces = NO;

            self.web.scrollView.contentInsetAdjustmentBehavior =
              UIScrollViewContentInsetAdjustmentNever;

            [self.view addSubview:self.web];

            self.retry = [UIButton
              buttonWithType:UIButtonTypeSystem];

            self.retry.frame = CGRectMake(
              20, 20, 220, 45
            );

            [self.retry
              setTitle:@"Retry connection"
              forState:UIControlStateNormal];

            self.retry.backgroundColor =
              UIColor.darkGrayColor;

            self.retry.tintColor =
              UIColor.whiteColor;

            self.retry.layer.cornerRadius = 10;

            [self.retry
              addTarget:self
              action:@selector(loadGame)
              forControlEvents:UIControlEventTouchUpInside];

            self.retry.hidden = YES;

            [self.view addSubview:self.retry];

            [self loadGame];
          }

          - (void)loadGame {

            self.retry.hidden = YES;

            NSURL *url = [NSURL URLWithString:
              @"https://kahnstation.kahn.lol/gopostal/"];

            NSMutableURLRequest *request =
              [NSMutableURLRequest
                requestWithURL:url];

            request.allowsCellularAccess = YES;
            request.timeoutInterval = 180;

            [self.web loadRequest:request];
          }

          - (void)webView:(WKWebView *)webView
          didFailProvisionalNavigation:(WKNavigation *)navigation
          withError:(NSError *)error {

            self.retry.hidden = NO;
          }

          - (void)webView:(WKWebView *)webView
          didFailNavigation:(WKNavigation *)navigation
          withError:(NSError *)error {

            self.retry.hidden = NO;
          }

          - (void)webViewWebContentProcessDidTerminate:
          (WKWebView *)webView {

            self.retry.hidden = NO;
          }

          @end

          @interface AppDelegate : UIResponder
          <UIApplicationDelegate>

          @property(nonatomic,strong) UIWindow *window;

          @end

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application
          didFinishLaunchingWithOptions:(NSDictionary *)options {

            self.window = [[UIWindow alloc]
              initWithFrame:UIScreen.mainScreen.bounds];

            self.window.rootViewController =
              [[GameController alloc] init];

            [self.window makeKeyAndVisible];

            return YES;
          }

          @end

          int main(int argc, char *argv[]) {
            @autoreleasepool {
              return UIApplicationMain(
                argc, argv, nil,
                NSStringFromClass([AppDelegate class]));
            }
          }
          EOF

          xcodegen generate

      - name: Build iPhone application
        run: |
          set -o pipefail

          xcodebuild \
            -project Postal2.xcodeproj \
            -scheme Postal2 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Build \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Create IPA
        run: |
          mkdir -p Payload

          cp -R \
            Build/Build/Products/Release-iphoneos/Postal2.app \
            Payload/

          test -f Payload/Postal2.app/Postal2

          zip -qry POSTAL2-V6.ipa Payload

          ls -lh POSTAL2-V6.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-V6-IPA
          path: POSTAL2-V6.ipa
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-V6-LOGS
          path: build.log
          if-no-files-found: ignore
