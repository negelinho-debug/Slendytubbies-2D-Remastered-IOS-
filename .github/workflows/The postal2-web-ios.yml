
name: POSTAL 2 iOS - V4

on:
  workflow_dispatch:

jobs:
  runtime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install runtime tools
        run: |
          npm install playwright
          npx playwright install --with-deps chromium webkit

      - name: Check game modules
        run: |
          mkdir -p logs

          cat > test.cjs <<'EOF'
          const { chromium, webkit } = require('playwright');
          const fs = require('fs');

          (async () => {
            let failed = false;

            for (const [name, engine] of [
              ['chromium', chromium],
              ['webkit', webkit]
            ]) {
              const browser = await engine.launch();
              const page = await browser.newPage();
              const errors = [];
              const log = [];

              page.on('response', r => {
                const url = r.url().split('?')[0];
                log.push(r.status() + ' ' + url);

                if (r.status() >= 400 &&
                    url.includes('/games/postal2/')) {
                  errors.push(url);
                }
              });

              page.on('pageerror', e => {
                log.push('ERROR: ' + e.message);
                errors.push(e.message);
              });

              try {
                const response = await page.goto(
                  'https://kahnstation.kahn.lol/gopostal/',
                  {
                    waitUntil: 'domcontentloaded',
                    timeout: 90000
                  }
                );

                if (!response.ok()) {
                  errors.push('HTTP ' + response.status());
                }

                await page.waitForTimeout(90000);

                await page.screenshot({
                  path: `logs/${name}.png`
                });

                for (const frame of page.frames()) {
                  const info = await frame.evaluate(() => ({
                    title: document.title,
                    canvas: document.querySelectorAll('canvas').length,
                    isolated: crossOriginIsolated,
                    sharedMemory: typeof SharedArrayBuffer
                  }));

                  log.push(JSON.stringify(info));
                }

              } catch (e) {
                errors.push(e.message);
              } finally {
                await browser.close();
              }

              fs.writeFileSync(
                `logs/${name}.txt`,
                log.concat(errors).join('\n')
              );

              if (errors.length) failed = true;
            }

            if (failed) process.exitCode = 1;
          })();
          EOF

          node test.cjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-V4-REPORT
          path: logs/
