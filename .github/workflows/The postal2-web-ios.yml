
name: POSTAL 2 iOS - V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GAME_URL: https://kahnstation.kahn.lol/gopostal/

    steps:
      - name: Install browser tools
        run: |
          npm install playwright
          npx playwright install --with-deps webkit

      - name: Test game runtime
        run: |
          mkdir -p logs

          cat > test.cjs <<'EOF'
          const { webkit } = require('playwright');
          const fs = require('fs');

          function log(text) {
            console.log(text);
            fs.appendFileSync(
              'logs/runtime.txt',
              text + '\n'
            );
          }

          (async () => {
            const browser = await webkit.launch();

            const context = await browser.newContext({
              viewport: {
                width: 844,
                height: 390
              },
              isMobile: true,
              hasTouch: true,
              deviceScaleFactor: 2
            });

            const page = await context.newPage();

            page.on('response', r => {
              log(
                r.status() + ' ' +
                r.request().resourceType() + ' ' +
                r.url().split('?')[0]
              );
            });

            page.on('pageerror', e => {
              log('ERROR: ' + e.message);
            });

            page.on('requestfailed', r => {
              log('FAILED: ' +
                r.url().split('?')[0]);
            });

            page.on('websocket', s => {
              log('WEBSOCKET: ' +
                s.url().split('?')[0]);
            });

            try {
              const response = await page.goto(
                process.env.GAME_URL,
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 120000
                }
              );

              log('HTTP: ' + response.status());

              if (!response.ok()) {
                throw new Error('Website unavailable');
              }

              await page.waitForTimeout(120000);

              const info = await page.evaluate(() => ({
                title: document.title,
                canvas: document.querySelectorAll(
                  'canvas'
                ).length,
                video: document.querySelectorAll(
                  'video'
                ).length,
                wasm: typeof WebAssembly,
                isolated: crossOriginIsolated,
                sharedMemory: typeof SharedArrayBuffer,
                resources: performance
                  .getEntriesByType('resource')
                  .map(r => ({
                    url: r.name.split('?')[0],
                    size: r.transferSize
                  }))
              }));

              fs.writeFileSync(
                'logs/resources.json',
                JSON.stringify(info, null, 2)
              );

              await page.screenshot({
                path: 'logs/online.png'
              });

              log('STARTING OFFLINE TEST');

              await context.setOffline(true);

              try {
                await page.reload({
                  waitUntil: 'domcontentloaded',
                  timeout: 30000
                });

                await page.waitForTimeout(30000);

                await page.screenshot({
                  path: 'logs/offline.png'
                });

                log('OFFLINE RELOAD COMPLETED');
              } catch (e) {
                log('OFFLINE FAILED: ' + e.message);
              }

              fs.writeFileSync(
                'logs/planned-controls.json',
                JSON.stringify({
                  movement: true,
                  cameraTouch: true,
                  sprint: true,
                  crouch: true,
                  jump: true,
                  attack: true,
                  alternateAttack: true,
                  kick: true,
                  reload: true,
                  inventory: true,
                  map: true,
                  urinate: true,
                  firstPerson: 'BehindView 0',
                  thirdPerson: 'BehindView 1',
                  mods: 'pending',
                  multiplayer: 'pending'
                }, null, 2)
              );

            } catch (e) {
              log('FATAL: ' + e.message);
              process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })();
          EOF

          node test.cjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-V3-REPORT
          path: logs/
