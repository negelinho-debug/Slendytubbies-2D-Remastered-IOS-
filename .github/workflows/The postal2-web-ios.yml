
name: POSTAL 2 iOS - V9.1 NATIVE FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    runs-on: macos-15
    timeout-minutes: 90

    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - name: Download engine
        run: |
          mkdir -p logs

          git clone --depth 1 \
            https://github.com/p2HookedDev/Postal-2-Reimplemented.git \
            engine

          cd engine
          git rev-parse HEAD > ../logs/commit.txt

      - name: Prepare ARM64
        working-directory: engine
        run: |
          rustup target add aarch64-apple-ios
          rustc --version
          xcodebuild -version

      - name: Fix RFD and Metal
        working-directory: engine
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          main = Path("crates/p2-game/src/main.rs")
          text = main.read_text()

          assert "Backends::VULKAN" in text

          main.write_text(
              text.replace(
                  "Backends::VULKAN",
                  "Backends::METAL"
              )
          )

          form = Path(
              "crates/p2-engine/src/game_dir_form.rs"
          )

          text = form.read_text()

          text, count = re.subn(
              r'(?m)^([ \t]*)(if ui\.button\("Browse"\))',
              r'\1#[cfg(not(target_os = "ios"))]\n\1\2',
              text
          )

          assert count == 1
          form.write_text(text)

          cargo = Path(
              "crates/p2-engine/Cargo.toml"
          )

          text = cargo.read_text()

          text, count = re.subn(
              r'(?m)^rfd\.workspace\s*=\s*true[ \t]*$',
              "",
              text
          )

          assert count == 1

          text += """
          [target.'cfg(not(target_os = "ios"))'.dependencies]
          rfd.workspace = true
          """

          cargo.write_text(text)

          game = Path(
              "crates/p2-engine/src/game_dir.rs"
          )

          text = game.read_text()

          needle = (
              "pub fn known_game_dir() -> Option<PathBuf> {"
          )

          assert needle in text

          text = text.replace(
              needle,
              needle + """
              #[cfg(target_os = "ios")]
              {
                  if let Some(home) = std::env::var_os("HOME") {
                      let path = PathBuf::from(home)
                          .join("Documents")
                          .join("GameData");

                      if is_game_dir(&path) {
                          return Some(path);
                      }
                  }

                  if let Ok(exe) = std::env::current_exe() {
                      if let Some(parent) = exe.parent() {
                          let path = parent.join("GameData");

                          if is_game_dir(&path) {
                              return Some(path);
                          }
                      }
                  }
              }
              """
          )

          game.write_text(text)

          print("iOS patches applied")
          PY

          git diff > ../logs/ios.patch

      - name: Build ARM64 native engine
        working-directory: engine
        run: |
          set -o pipefail

          cargo build \
            -p p2-game \
            --target aarch64-apple-ios \
            --jobs 3 \
            2>&1 | tee ../logs/build.log

      - name: Prepare iOS application
        run: |
          mkdir -p Payload/Postal2.app

          BIN="engine/target/aarch64-apple-ios/debug/p2-game"

          test -f "$BIN"

          cp "$BIN" Payload/Postal2.app/Postal2
          chmod +x Payload/Postal2.app/Postal2

          cp engine/LICENSE \
            Payload/Postal2.app/Engine-LICENSE.txt

          file Payload/Postal2.app/Postal2

          xcrun lipo -archs \
            Payload/Postal2.app/Postal2

      - name: Create iOS Info.plist
        run: |
          python3 <<'PY'
          import plistlib

          info = {
              "CFBundleName": "Postal2",
              "CFBundleDisplayName": "POSTAL 2",
              "CFBundleIdentifier":
                  "com.projectparadise.postal2",
              "CFBundleExecutable": "Postal2",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": "9.1",
              "CFBundleVersion": "91",
              "MinimumOSVersion": "16.0",
              "CFBundleSupportedPlatforms": [
                  "iPhoneOS"
              ],
              "UIDeviceFamily": [1],
              "UIRequiresFullScreen": True,
              "UIFileSharingEnabled": True,
              "LSSupportsOpeningDocumentsInPlace": True,
              "UILaunchScreen": {},
              "UISupportedInterfaceOrientations": [
                  "UIInterfaceOrientationLandscapeLeft",
                  "UIInterfaceOrientationLandscapeRight"
              ]
          }

          with open(
              "Payload/Postal2.app/Info.plist", "wb"
          ) as f:
              plistlib.dump(info, f)

          PY

          plutil -lint Payload/Postal2.app/Info.plist

      - name: Package native IPA
        run: |
          zip -qry POSTAL2-V9.1-ENGINE.ipa Payload
          ls -lh POSTAL2-V9.1-ENGINE.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-V9.1-IPA
          path: POSTAL2-V9.1-ENGINE.ipa
          compression-level: 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-V9.1-LOGS
          path: logs/
