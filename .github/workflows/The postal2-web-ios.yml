
name: POSTAL 2 iOS - V8 NATIVE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      CARGO_TERM_COLOR: never

    steps:
      - name: Download native engine
        run: |
          mkdir -p logs

          git clone --depth 1 \
            https://github.com/p2HookedDev/Postal-2-Reimplemented.git \
            engine

          cd engine
          git rev-parse HEAD > ../logs/commit.txt

      - name: Prepare ARM64
        working-directory: engine
        run: |
          rustup show
          rustup target add aarch64-apple-ios
          rustc --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Adapt Vulkan to Metal
        working-directory: engine
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("crates/p2-game/src/main.rs")
          s = p.read_text()

          old = "Backends::VULKAN"
          new = "Backends::METAL"

          if old not in s:
              raise RuntimeError(
                  "Renderer source changed"
              )

          p.write_text(s.replace(old, new))

          print("Metal backend selected")
          PY

          git diff > ../logs/ios.patch

      - name: Compile native ARM64 engine
        working-directory: engine
        run: |
          set -o pipefail

          cargo build \
            --locked \
            -p p2-game \
            --target aarch64-apple-ios \
            --jobs 3 \
            2>&1 | tee ../logs/build.log

      - name: Verify native executable
        run: |
          BIN="engine/target/aarch64-apple-ios/debug/p2-game"

          test -f "$BIN"

          file "$BIN" | tee logs/binary.txt
          xcrun lipo -archs "$BIN"

          mkdir -p Native
          cp "$BIN" Native/Postal2

      - name: Upload native engine
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-V8-ARM64
          path: Native/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-V8-LOGS
          path: logs/
