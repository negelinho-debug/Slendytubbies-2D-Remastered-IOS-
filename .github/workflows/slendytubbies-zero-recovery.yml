
name: Slendytubbies Zero 1.1.0 - Recovery

on:
  workflow_dispatch:
    inputs:
      preflight_run:
        description: "Previous Preflight run ID (optional)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ github.token }}
      PREFLIGHT_RUN: ${{ inputs.preflight_run }}

    steps:
      - uses: actions/checkout@v5

      - name: Prepare folders
        run: |
          mkdir -p download original output tools export

          df -h

      - name: Download existing Zero archive
        run: |
          set -euo pipefail

          RUN="$PREFLIGHT_RUN"

          if [ -z "$RUN" ]; then

            RUN=$(gh run list \
              --workflow slendytubbies-zero-check.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')

          fi

          test -n "$RUN"

          gh run download "$RUN" \
            --name Zero-Original \
            --dir download

          test -s download/game.archive

          ls -lh download/game.archive

          echo "Existing original game downloaded"

      - name: Extract original Zero 1.1.0
        run: |
          set -euo pipefail

          7z x -y \
            -ooriginal \
            download/game.archive

          rm download/game.archive

          DLL=$(find "$PWD/original" \
            -type f \
            -name Assembly-CSharp.dll \
            -print -quit)

          test -n "$DLL"

          test "$(stat -c%s "$DLL")" = 995328

          DATA=$(dirname "$(dirname "$DLL")")

          ROOT=$(dirname "$DATA")

          echo "GAME_DATA=$DATA" >> "$GITHUB_ENV"

          echo "GAME_ROOT=$ROOT" >> "$GITHUB_ENV"

          cp "$DLL" \
            output/Assembly-CSharp-original.dll

          echo "Original DLL verified"

          df -h

      - name: Verify original Unity game
        run: |
          set -euo pipefail

          python3 - <<'PY' | tee output/game-report.txt
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["GAME_ROOT"])
          data = Path(os.environ["GAME_DATA"])

          dll = data / "Managed/Assembly-CSharp.dll"

          assert dll.is_file()

          assert dll.stat().st_size == 995328

          if any(root.rglob("GameAssembly.dll")):
              raise SystemExit("Unexpected IL2CPP")

          if any(root.rglob("global-metadata.dat")):
              raise SystemExit("Unexpected IL2CPP metadata")

          versions = set()

          for path in root.rglob("*"):

              if not path.is_file():
                  continue

              if (
                  path.name.lower() not in {
                      "globalgamemanagers",
                      "unityplayer.dll",
                      "maindata",
                      "data.unity3d"
                  }
                  and path.suffix.lower()
                  not in {".assets", ".exe"}
              ):
                  continue

              with path.open("rb") as f:
                  content = f.read(4194304)

              for match in re.findall(
                  rb"(?:20\d{2}|6000|[345])\.\d+\.\d+[abfp]\d+",
                  content
              ):
                  versions.add(match.decode())

          print("Game: Slendytubbies Zero 1.1.0")
          print("Backend: Mono")
          print("Original DLL bytes:", dll.stat().st_size)
          print("Detected Unity versions:", sorted(versions))

          if "2022.3.58f1" not in versions:
              raise SystemExit(
                  "Original Unity version not confirmed"
              )

          print("Original game verified")
          PY

      - name: Download AssetRipper
        run: |
          set -euo pipefail

          curl -fLsS --retry 3 \
            --max-time 300 \
            https://github.com/AssetRipper/AssetRipper/releases/download/2.0.0/AssetRipper_linux_x64.tar.xz \
            -o tools/ripper.tar.xz

          mkdir -p tools/ripper

          tar -xJf tools/ripper.tar.xz \
            -C tools/ripper

          rm tools/ripper.tar.xz

      - name: Recover original Zero Unity project
        timeout-minutes: 30
        run: |
          set -euo pipefail

          RIPPER=$(find "$PWD/tools/ripper" \
            -type f \
            -name AssetRipper.GUI.Free \
            -print -quit)

          test -x "$RIPPER"

          "$RIPPER" \
            --headless \
            --port 18926 \
            > output/assetripper.log 2>&1 &

          PID=$!

          trap 'kill "$PID" 2>/dev/null || true' EXIT

          API=http://127.0.0.1:18926

          curl -fsS \
            --retry 30 \
            --retry-connrefused \
            --retry-delay 2 \
            "$API/Settings/Edit" \
            -o /dev/null

          curl -fsS \
            -d 'ScriptExportMode=DllExportWithRenaming&ScriptContentLevel=Level2' \
            "$API/Settings/Update" \
            -o /dev/null

          echo "Loading original Slendytubbies Zero"

          curl -fsS \
            --max-time 600 \
            --data-urlencode "Path=$GAME_ROOT" \
            "$API/LoadFolder" \
            -o /dev/null

          echo "Exporting original Unity project"

          curl -fsS \
            --max-time 1200 \
            --data-urlencode "Path=$PWD/export" \
            "$API/Export/UnityProject" \
            -o /dev/null

          test -d export/ExportedProject/Assets

          test -d export/ExportedProject/ProjectSettings

          df -h

      - name: Verify original campaign scenes
        run: |
          set -euo pipefail

          PROJECT=export/ExportedProject

          find "$PROJECT/Assets" \
            -type f \
            -name '*.unity' \
            | sort | tee output/scenes.txt

          COUNT=$(wc -l < output/scenes.txt)

          test "$COUNT" -gt 0

          echo "Recovered scenes: $COUNT"

          find "$PROJECT/Assets" \
            -type f \
            -name '*.prefab' \
            | sort > output/prefabs.txt

          find "$PROJECT/Assets" \
            -type f \
            -name '*.dll' \
            | sort > output/assemblies.txt

          find "$PROJECT/Assets" \
            -type f \
            -name '*.cs' \
            | sort > output/scripts.txt

      - name: Verify original game DLL
        run: |
          set -euo pipefail

          PROJECT=export/ExportedProject

          DLL=$(find "$PROJECT/Assets" \
            -type f \
            -name Assembly-CSharp.dll \
            -print -quit)

          test -n "$DLL"

          test -s "$DLL"

          test -s "$DLL.meta"

          echo "Recovered game DLL: $DLL"

          sha256sum \
            output/Assembly-CSharp-original.dll \
            "$DLL" \
            | tee output/assembly-hashes.txt

      - name: Preserve original build settings
        run: |
          set -euo pipefail

          PROJECT=export/ExportedProject

          test -s "$PROJECT/ProjectSettings/EditorBuildSettings.asset"

          cp "$PROJECT/ProjectSettings/EditorBuildSettings.asset" \
            output/

          cp "$PROJECT/ProjectSettings/ProjectVersion.txt" \
            output/

          cat output/ProjectVersion.txt

          cat output/EditorBuildSettings.asset

      - name: Check original scene integrity
        run: |
          python3 - <<'PY' | tee output/scene-integrity.txt
          import re
          from pathlib import Path

          assets = Path(
              "export/ExportedProject/Assets"
          )

          total = 0

          for scene in sorted(assets.rglob("*.unity")):

              source = scene.read_text(
                  errors="replace"
              )

              missing = len(re.findall(
                  r"(?m)^\s*m_Script:\s*\{fileID: 0\}",
                  source
              ))

              total += missing

              print(
                  scene.relative_to(assets),
                  "| Empty script references:",
                  missing
              )

          print("Total empty references:", total)
          print("Unity validation still required")
          PY

      - name: Check gameplay and original controls
        run: |
          python3 - <<'PY' | tee output/gameplay.txt
          import re
          from pathlib import Path

          dll = Path(
              "output/Assembly-CSharp-original.dll"
          )

          terms = [
              "campaign",
              "story",
              "chapter",
              "dialog",
              "cutscene",
              "ending",
              "checkpoint",
              "save",
              "load",
              "inventory",
              "nightvision",
              "flashlight",
              "puzzle",
              "input",
              "controller",
              "sprint",
              "crouch",
              "jump",
              "arcade"
          ]

          found = set()

          for raw in re.findall(
              rb"[A-Za-z_][A-Za-z0-9_.]{3,120}",
              dll.read_bytes()
          ):

              name = raw.decode(
                  "ascii",
                  errors="ignore"
              )

              if any(
                  term in name.lower()
                  for term in terms
              ):
                  found.add(name)

          for name in sorted(found):
              print(name)
          PY

      - name: Analyze project size
        run: |
          python3 - <<'PY' | tee output/assets-report.txt
          from pathlib import Path

          root = Path(
              "export/ExportedProject/Assets"
          )

          files = [
              p for p in root.rglob("*")
              if p.is_file()
          ]

          print(
              "Recovered assets:",
              round(
                  sum(
                      p.stat().st_size
                      for p in files
                  ) / 1048576,
                  2
              ),
              "MB"
          )

          print("\nLargest assets:")

          for p in sorted(
              files,
              key=lambda p: p.stat().st_size,
              reverse=True
          )[:30]:

              print(
                  round(
                      p.stat().st_size / 1048576,
                      2
                  ),
                  "MB",
                  p.relative_to(root)
              )

          print("\nNo assets removed or compressed yet")
          PY

      - name: Package reusable original project
        run: |
          set -euo pipefail

          rm -rf original tools/ripper

          df -h

          tar -cf - \
            -C export ExportedProject \
            | gzip -1 \
            > output/Zero-Unity-Project.tar.gz

          test -s output/Zero-Unity-Project.tar.gz

          gzip -t output/Zero-Unity-Project.tar.gz

          ls -lh output/

      - name: Create Recovery summary
        if: always()
        run: |
          {
            echo "# Slendytubbies Zero 1.1.0"
            echo ""
            echo "## Original game"
            echo '```'
            cat output/game-report.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "## Recovered Unity version"
            echo '```'
            cat output/ProjectVersion.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "## Original scenes"
            echo '```'
            cat output/scenes.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "## Scene integrity"
            echo '```'
            cat output/scene-integrity.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "## Reusable project"
            echo '```'
            ls -lh output/Zero-Unity-Project.tar.gz 2>/dev/null || true
            echo '```'
            echo ""
            echo "No Unity installation"
            echo "No Xcode"
            echo "No IPA compilation"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Zero Recovery
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Recovery
          path: output/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Recovery-Logs
          path: |
            output/*.txt
            output/*.log
            output/*.asset
          retention-days: 14
          if-no-files-found: warn
