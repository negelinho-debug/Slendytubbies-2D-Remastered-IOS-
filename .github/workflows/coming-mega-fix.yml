
name: Coming - Mega Fix V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mega-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Prepare tools
        run: |
          mkdir -p game reports recovered recovered-code output
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python3 -m pip install requests beautifulsoup4

      - name: Download original Coming
        run: |
          python3 - <<'PY'
          import requests
          import zipfile
          from bs4 import BeautifulSoup

          url = "https://www.mediafire.com/file/dym00pxjpkcc1oz/Coming.zip/file"

          session = requests.Session()
          session.headers["User-Agent"] = "Mozilla/5.0"

          page = session.get(url, timeout=60)
          page.raise_for_status()

          soup = BeautifulSoup(page.text, "html.parser")
          button = soup.select_one("#downloadButton")

          if not button or not button.get("href"):
              raise RuntimeError("Download link not found")

          with session.get(
              button["href"],
              stream=True,
              timeout=120
          ) as response:
              response.raise_for_status()

              with open("Coming.zip", "wb") as file:
                  for chunk in response.iter_content(1024 * 1024):
                      file.write(chunk)

          if not zipfile.is_zipfile("Coming.zip"):
              raise RuntimeError("Invalid ZIP archive")

          print("Coming downloaded successfully")
          PY

      - name: Extract original game
        run: |
          set -euo pipefail
          7z t Coming.zip
          7z x Coming.zip -ogame -y

      - name: Detect Unity
        run: |
          set -euo pipefail

          managers="$(find game -name globalgamemanagers -print -quit)"
          dll="$(find game -name Assembly-CSharp.dll -print -quit)"

          test -n "$managers"
          test -n "$dll"

          echo "GAME_ROOT=$(dirname "$managers")" >> "$GITHUB_ENV"
          echo "GAME_DLL=$dll" >> "$GITHUB_ENV"

          echo "COMING MEGA FIX V1" > reports/summary.txt

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build AssetRipper
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/nowl-it/AssetRipperCLI.git \
            "$RUNNER_TEMP/ripper"

          dotnet publish \
            "$RUNNER_TEMP/ripper/Source/AssetRipper.GUI.Free/AssetRipper.GUI.Free.csproj" \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishAot=false \
            -o "$RUNNER_TEMP/ripper-bin"

      - name: Full Recovery
        run: |
          set -euo pipefail

          dotnet "$RUNNER_TEMP/ripper-bin/AssetRipper.GUI.Free.dll" \
            --cli \
            --input "$GAME_ROOT" \
            --output "$PWD/recovered" \
            --mode Unity \
            --script-content-level Level0 \
            > reports/assetripper.log 2>&1

          version="$(find recovered -name ProjectVersion.txt -print -quit)"

          test -n "$version"

          project="$(dirname "$(dirname "$version")")"

          test -d "$project/Assets"

          echo "RECOVERED_PROJECT=$project" >> "$GITHUB_ENV"

      - name: Install ILSpy
        run: |
          dotnet tool install ilspycmd \
            --tool-path "$RUNNER_TEMP/tools" \
            --version 9.1.0.7988

      - name: Recover additional gameplay assemblies
        run: |
          set -euo pipefail

          managed="$(dirname "$GAME_DLL")"

          find "$managed" -maxdepth 1 -name '*.dll' \
            > reports/assemblies.txt

          for dll in "$managed"/Assembly-*.dll; do

            [ -f "$dll" ] || continue

            name="$(basename "$dll" .dll)"

            mkdir -p "recovered-code/$name"

            if ! "$RUNNER_TEMP/tools/ilspycmd" \
              --project \
              --outputdir "recovered-code/$name" \
              --referencepath "$managed" \
              "$dll" \
              > "reports/$name.log" 2>&1; then

              echo "Decompilation failed: $name" >> reports/summary.txt

            fi

          done

          test -n "$(find recovered-code -name '*.cs' -print -quit)"

      - name: Advanced script recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import os
          import csv
          import re

          project = Path(os.environ["RECOVERED_PROJECT"])
          assets = project / "Assets"
          code = Path("recovered-code")

          sources = defaultdict(list)

          for file in code.rglob("*.cs"):
              sources[file.name.casefold()].append(file)

          restored = 0
          unresolved = 0
          results = []

          for file in assets.rglob("*.cs"):

              text = file.read_text(
                  encoding="utf-8-sig",
                  errors="replace"
              )

              if "Dummy class. This could have happened" not in text:
                  continue

              candidates = sources.get(file.name.casefold(), [])

              if len(candidates) > 1:
                  namespace = re.search(
                      r'\bnamespace\s+([\w.]+)',
                      text
                  )

                  if namespace:
                      expected = namespace.group(1)

                      candidates = [
                          p for p in candidates
                          if re.search(
                              r'\bnamespace\s+' +
                              re.escape(expected) +
                              r'\s*[{;]',
                              p.read_text(errors="replace")
                          )
                      ]

              if len(candidates) == 1:

                  replacement = candidates[0].read_text(
                      encoding="utf-8-sig",
                      errors="replace"
                  )

                  if replacement.strip():

                      file.write_text(
                          replacement,
                          encoding="utf-8"
                      )

                      restored += 1
                      results.append([str(file), "Restored"])
                      continue

              unresolved += 1
              results.append([str(file), "Unresolved"])

          with open("reports/scripts.csv", "w", newline="") as report:
              writer = csv.writer(report)
              writer.writerow(["Script", "Status"])
              writer.writerows(results)

          with open("reports/summary.txt", "a") as report:
              report.write(f"\nRestored scripts: {restored}\n")
              report.write(f"Unresolved scripts: {unresolved}\n")

          print("Restored:", restored)
          print("Unresolved:", unresolved)
          PY

      - name: Install mobile input bridge
        run: |
          mkdir -p "$RECOVERED_PROJECT/Assets/Plugins/ComingMobile"

          cat > "$RECOVERED_PROJECT/Assets/Plugins/ComingMobile/ComingTouch.cs" <<'CS'
          using UnityEngine;

          public class ComingTouch : MonoBehaviour
          {
              private static bool enabledTouch;
              private static int frame = -1;
              private static int held;
              private static int previous;
              private static Vector2 movement;
              private static Vector2 look;

              private static int language;

              private static readonly Rect joystick =
                  new Rect(20, 360, 220, 220);

              private static readonly Rect[] buttons = {
                  new Rect(860, 370, 120, 90),
                  new Rect(720, 480, 120, 90),
                  new Rect(860, 480, 120, 90),
                  new Rect(720, 370, 120, 90),
                  new Rect(570, 480, 130, 90),
                  new Rect(570, 370, 130, 90)
              };

              private static readonly string[,] labels = {
                  {"Jump", "Run", "Crouch", "Use", "Light", "Pause"},
                  {"Стрибок", "Біг", "Присісти", "Дія", "Світло", "Пауза"},
                  {"Прыжок", "Бег", "Присесть", "Действие", "Свет", "Пауза"}
              };

              [RuntimeInitializeOnLoadMethod]
              private static void Init()
              {
                  if (!Application.isMobilePlatform)
                      return;

                  GameObject obj =
                      new GameObject("Coming Mobile");

                  DontDestroyOnLoad(obj);
                  obj.AddComponent<ComingTouch>();

                  language = Mathf.Clamp(
                      PlayerPrefs.GetInt("ComingLanguage", 0),
                      0, 2
                  );
              }

              private static void ReadTouch()
              {
                  if (frame == Time.frameCount)
                      return;

                  frame = Time.frameCount;
                  previous = held;
                  held = 0;
                  movement = Vector2.zero;
                  look = Vector2.zero;

                  if (!Application.isMobilePlatform)
                      return;

                  foreach (Touch t in Input.touches)
                  {
                      if (t.phase == TouchPhase.Ended ||
                          t.phase == TouchPhase.Canceled)
                          continue;

                      Vector2 p = new Vector2(
                          t.position.x * 1000f / Screen.width,
                          (Screen.height - t.position.y) *
                          600f / Screen.height
                      );

                      if (t.phase == TouchPhase.Began)
                      {
                          if (new Rect(10, 10, 150, 50).Contains(p))
                          {
                              enabledTouch = !enabledTouch;
                              continue;
                          }

                          if (new Rect(180, 10, 100, 50).Contains(p))
                          {
                              language = (language + 1) % 3;
                              PlayerPrefs.SetInt(
                                  "ComingLanguage", language
                              );
                              PlayerPrefs.Save();
                              continue;
                          }
                      }

                      if (!enabledTouch)
                          continue;

                      if (joystick.Contains(p))
                      {
                          movement = Vector2.ClampMagnitude(
                              new Vector2(
                                  (p.x - joystick.center.x) / 90f,
                                  (joystick.center.y - p.y) / 90f
                              ), 1f
                          );
                          continue;
                      }

                      bool button = false;

                      for (int i = 0; i < buttons.Length; i++)
                      {
                          if (buttons[i].Contains(p))
                          {
                              held |= 1 << i;
                              button = true;
                          }
                      }

                      if (!button && p.x > 400 && p.y > 70)
                      {
                          look += new Vector2(
                              t.deltaPosition.x * 1000f / Screen.width,
                              t.deltaPosition.y * 600f / Screen.height
                          ) * 0.12f;
                      }
                  }
              }

              private void Update()
              {
                  ReadTouch();
              }

              private void OnGUI()
              {
                  Matrix4x4 old = GUI.matrix;

                  GUI.matrix = Matrix4x4.TRS(
                      Vector3.zero,
                      Quaternion.identity,
                      new Vector3(
                          Screen.width / 1000f,
                          Screen.height / 600f,
                          1f
                      )
                  );

                  GUI.skin.box.fontSize = 20;

                  GUI.Box(
                      new Rect(10, 10, 150, 50),
                      enabledTouch ? "Touch ON" : "Touch OFF"
                  );

                  GUI.Box(
                      new Rect(180, 10, 100, 50),
                      language == 0 ? "EN" :
                      language == 1 ? "UA" : "RU"
                  );

                  if (enabledTouch)
                  {
                      GUI.Box(joystick, "+");

                      GUI.Box(
                          new Rect(
                              joystick.center.x + movement.x * 65 - 25,
                              joystick.center.y - movement.y * 65 - 25,
                              50, 50
                          ),
                          "O"
                      );

                      for (int i = 0; i < buttons.Length; i++)
                          GUI.Box(buttons[i], labels[language, i]);
                  }

                  GUI.matrix = old;
              }

              private static bool Axis(string name, out float value)
              {
                  ReadTouch();
                  value = 0;

                  if (!enabledTouch)
                      return false;

                  switch (name.ToLowerInvariant())
                  {
                      case "horizontal":
                          value = movement.x;
                          return true;

                      case "vertical":
                          value = movement.y;
                          return true;

                      case "mouse x":
                          value = look.x;
                          return true;

                      case "mouse y":
                          value = look.y;
                          return true;
                  }

                  return false;
              }

              public static float GetAxis(string name)
              {
                  float value;
                  return Axis(name, out value)
                      ? value : Input.GetAxis(name);
              }

              public static float GetAxisRaw(string name)
              {
                  float value;
                  return Axis(name, out value)
                      ? value : Input.GetAxisRaw(name);
              }

              private static int Mask(string name)
              {
                  switch (name.ToLowerInvariant())
                  {
                      case "space":
                      case "jump": return 1;

                      case "leftshift":
                      case "left shift":
                      case "sprint":
                      case "run": return 2;

                      case "leftcontrol":
                      case "left ctrl":
                      case "c":
                      case "crouch": return 4;

                      case "e":
                      case "interact":
                      case "use": return 8;

                      case "f":
                      case "flashlight": return 16;

                      case "escape":
                      case "pause":
                      case "cancel": return 32;
                  }

                  return 0;
              }

              private static bool VirtualKey(string key, int mode)
              {
                  ReadTouch();

                  int mask = Mask(key);

                  if (!enabledTouch || mask == 0)
                      return false;

                  if (mode == 1)
                      return (held & mask) != 0 &&
                             (previous & mask) == 0;

                  if (mode == 2)
                      return (held & mask) == 0 &&
                             (previous & mask) != 0;

                  return (held & mask) != 0;
              }

              public static bool GetKey(KeyCode key)
              {
                  return VirtualKey(key.ToString(), 0) ||
                         Input.GetKey(key);
              }

              public static bool GetKeyDown(KeyCode key)
              {
                  return VirtualKey(key.ToString(), 1) ||
                         Input.GetKeyDown(key);
              }

              public static bool GetKeyUp(KeyCode key)
              {
                  return VirtualKey(key.ToString(), 2) ||
                         Input.GetKeyUp(key);
              }

              public static bool GetKey(string key)
              {
                  return VirtualKey(key, 0) || Input.GetKey(key);
              }

              public static bool GetKeyDown(string key)
              {
                  return VirtualKey(key, 1) || Input.GetKeyDown(key);
              }

              public static bool GetKeyUp(string key)
              {
                  return VirtualKey(key, 2) || Input.GetKeyUp(key);
              }

              public static bool GetButton(string key)
              {
                  return VirtualKey(key, 0) || Input.GetButton(key);
              }

              public static bool GetButtonDown(string key)
              {
                  return VirtualKey(key, 1) || Input.GetButtonDown(key);
              }

              public static bool GetButtonUp(string key)
              {
                  return VirtualKey(key, 2) || Input.GetButtonUp(key);
              }
          }
          CS

      - name: Connect mobile controls to original scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          assets = Path(os.environ["RECOVERED_PROJECT"]) / "Assets"

          pattern = re.compile(
              r'(?<![\w.])(?:UnityEngine\.)?Input\.'
              r'(GetAxisRaw|GetAxis|GetKeyDown|GetKeyUp|GetKey|'
              r'GetButtonDown|GetButtonUp|GetButton)\s*\('
          )

          patched = 0

          for file in assets.rglob("*.cs"):

              if "ComingMobile" in file.parts:
                  continue

              text = file.read_text(errors="replace")

              if "Dummy class. This could have happened" in text:
                  continue

              if "using UnityEngine;" not in text:
                  continue

              if re.search(r'using\s+Input\s*=', text):
                  continue

              updated, count = pattern.subn(
                  lambda m: "ComingTouch." + m.group(1) + "(",
                  text
              )

              if count:
                  file.write_text(updated, encoding="utf-8")
                  patched += 1

          with open("reports/summary.txt", "a") as report:
              report.write(f"Input scripts patched: {patched}\n")
              report.write("Experimental touch controls added\n")
              report.write("Touch interface languages: EN / UA / RU\n")

          print("Input scripts patched:", patched)
          PY

      - name: Check textures shaders and scenes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          assets = Path(os.environ["RECOVERED_PROJECT"]) / "Assets"

          lines = [
              "",
              "MEGA FIX RESULTS",
              f"Scenes: {len(list(assets.rglob('*.unity')))}",
              f"Animations: {len(list(assets.rglob('*.anim')))}",
              f"Materials: {len(list(assets.rglob('*.mat')))}",
              f"Shaders: {len(list(assets.rglob('*.shader')))}",
              f"Scripts: {len(list(assets.rglob('*.cs')))}",
              "Original scenes and materials preserved",
              "Unity compilation not tested",
              "Shader compatibility not verified",
              "Full campaign translation not implemented"
          ]

          with open("reports/summary.txt", "a") as report:
              report.write("\n".join(lines) + "\n")

          print("\n".join(lines))
          PY

      - name: Add runtime debug log
        run: |
          cat > "$RECOVERED_PROJECT/Assets/Plugins/ComingMobile/ComingLog.cs" <<'CS'
          using UnityEngine;
          using System.IO;

          public static class ComingLog
          {
              private static string path;

              [RuntimeInitializeOnLoadMethod]
              private static void Init()
              {
                  path = Path.Combine(
                      Application.persistentDataPath,
                      "ComingDebug.txt"
                  );

                  Application.logMessageReceived += Save;
              }

              private static void Save(
                  string message,
                  string stack,
                  LogType type
              )
              {
                  try
                  {
                      if (File.Exists(path) &&
                          new FileInfo(path).Length > 2097152)
                          File.WriteAllText(path, "");

                      File.AppendAllText(
                          path,
                          type + ": " + message + "\n" +
                          stack + "\n"
                      );
                  }
                  catch {}
              }
          }
          CS

      - name: Save recovered project
        env:
          ARCHIVE_PASSWORD: ${{ secrets.COMING_ARCHIVE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ARCHIVE_PASSWORD" ]; then
            echo "WARNING: No archive password. Project will not be retained." >> reports/summary.txt
            exit 0
          fi

          7z a -t7z -mhe=on \
            -p"$ARCHIVE_PASSWORD" \
            output/Coming-Mega-Fix.7z \
            recovered/ recovered-code/ \
            > /dev/null

      - name: Show results
        if: always()
        run: |
          if [ -f reports/summary.txt ]; then
            cat reports/summary.txt
            cat reports/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coming-Mega-Fix-Report
          path: reports/summary.txt
          retention-days: 7

      - name: Upload encrypted project
        uses: actions/upload-artifact@v4
        with:
          name: Coming-Mega-Fix
          path: output/Coming-Mega-Fix.7z
          if-no-files-found: ignore
          retention-days: 7
