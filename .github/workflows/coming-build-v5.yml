name: Coming - Create IPA V6 Mega Fix

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recovery:
    uses: ./.github/workflows/coming-create-ipa.yml
    secrets:
      COMING_ARCHIVE_PASSWORD: ${{ secrets.COMING_ARCHIVE_PASSWORD }}

  build-ipa:
    needs: recovery
    runs-on: macos-15
    timeout-minutes: 180

    env:
      UNITY_VERSION: 2022.3.62f3
      UNITY_CHANGESET: 96770f904ca7
      V5_COMMIT: 8a04934116be64bd441023ed302aef4f16212005

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete V5
        run: |
          set -euo pipefail

          mkdir -p .coming-v6 reports

          python3 -m venv .coming-v6/venv

          .coming-v6/venv/bin/pip install \
            pyyaml requests beautifulsoup4

          git show \
            "$V5_COMMIT:.github/workflows/coming-build-v5.yml" \
            > .coming-v6/v5.yml

          git show \
            "$V5_COMMIT:.github/workflows/coming-create-ipa.yml" \
            > .coming-v6/recovery.yml

          .coming-v6/venv/bin/python - <<'PY'
          import yaml
          from pathlib import Path

          root = Path(".coming-v6")

          data = yaml.safe_load(
              (root / "v5.yml").read_text()
          )

          steps = data["jobs"]["build-ipa"]["steps"]

          mapping = {
              "Prepare tools": "tools",
              "Extract recovered project": "extract",
              "V5 Fix CSharp 10 to CSharp 9": "csharp",
              "Prepare Unity project": "prepare",
              "Create Unity iOS builder": "builder",
              "Enable iPhone Files access": "files",
              "Install Unity CLI V4": "cli",
              "Install Unity and iOS module": "install",
              "Verify Unity installation": "verify",
              "Activate Unity Personal": "activate",
              "Unity iOS IL2CPP export": "export",
              "Return Unity License": "return",
              "Find Xcode project": "find",
              "Compile ARM64 iOS application": "xcode",
              "Create real IPA V5": "ipa",
              "Protect IPA": "protect",
              "Final summary": "summary"
          }

          found = set()

          for step in steps:
              name = step.get("name")

              if name not in mapping:
                  continue

              script = step["run"]

              script = script.replace(
                  "Coming-iOS-V5",
                  "Coming-iOS-V6"
              )

              script = script.replace(
                  "COMING V5 IPA",
                  "COMING V6 IPA"
              )

              if name == "Create Unity iOS builder":
                  script = script.replace(
                      '"5";',
                      '"6";'
                  )

              path = root / (
                  mapping[name] + ".sh"
              )

              path.write_text(script)
              found.add(name)

          missing = set(mapping) - found

          if missing:
              raise RuntimeError(str(missing))

          recovery = yaml.safe_load(
              (root / "recovery.yml").read_text()
          )

          download = next(
              s["run"]
              for s in recovery["jobs"]["mega-fix"]["steps"]
              if s.get("name") == "Download original Coming"
          )

          (root / "download-original.sh").write_text(
              download
          )

          print("V5 restored successfully")
          PY

      - name: Prepare tools
        env:
          PASSWORD: ${{ secrets.COMING_ARCHIVE_PASSWORD }}
        run: bash .coming-v6/tools.sh

      - name: Download recovered project
        uses: actions/download-artifact@v4
        with:
          name: Coming-Mega-Fix
          path: incoming

      - name: Extract recovered project
        env:
          PASSWORD: ${{ secrets.COMING_ARCHIVE_PASSWORD }}
        run: bash .coming-v6/extract.sh

      - name: V6 Restore original dependencies
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import re

          assets = Path("ComingProject/Assets")
          plugins = assets / "Plugins"

          sources = Path("restored/recovered-code")

          if not sources.is_dir():
              raise RuntimeError(
                  "Recovered original code not found"
              )

          groups = {
              "Assembly-CSharp-firstpass": [
                  "AAMode",
                  "TweakMode34",
                  "BloomScreenBlendMode",
                  "HDRBloomMode",
                  "LensflareStyle34",
                  "WaterQuality",
                  "RenderTextureUtility"
              ],

              "Assembly-UnityScript-firstpass": [
                  "CharacterMotorMovement",
                  "CharacterMotorJumping",
                  "CharacterMotorMovingPlatform",
                  "CharacterMotorSliding",
                  "CharacterState",
                  "DofBlurriness",
                  "Dof34QualitySetting",
                  "DofResolution",
                  "BokehDestination",
                  "EdgeDetectMode",
                  "AAMode",
                  "TweakMode34",
                  "BloomScreenBlendMode",
                  "HDRBloomMode",
                  "LensflareStyle34",
                  "PostEffectsBase"
              ]
          }

          restored = 0
          added = 0
          unresolved = []

          def read(path):
              return path.read_text(
                  encoding="utf-8-sig"
              )

          def is_dummy(text):
              return (
                  "Dummy class. This could have happened"
                  in text
              )

          for assembly in groups:
              source = sources / assembly
              target = plugins / assembly

              if not source.is_dir():
                  unresolved.append(assembly)
                  continue

              target.mkdir(
                  parents=True,
                  exist_ok=True
              )

              index = {}

              for file in source.rglob("*.cs"):
                  index.setdefault(
                      file.name.casefold(),
                      []
                  ).append(file)

              for file in list(target.rglob("*.cs")):
                  text = read(file)

                  if not is_dummy(text):
                      continue

                  candidates = index.get(
                      file.name.casefold(),
                      []
                  )

                  if len(candidates) != 1:
                      continue

                  original = read(candidates[0])

                  if is_dummy(original):
                      continue

                  file.write_text(
                      original,
                      encoding="utf-8"
                  )

                  restored += 1

                  print("RESTORED:", file)

              for name in groups[assembly]:
                  declaration = re.compile(
                      r'\b(?:class|struct|enum|interface)'
                      r'\s+' + re.escape(name) +
                      r'\b'
                  )

                  existing = []

                  for file in target.rglob("*.cs"):
                      if declaration.search(read(file)):
                          existing.append(file)

                  candidates = [
                      p for p in index.get(
                          (name + ".cs").casefold(),
                          []
                      )
                      if declaration.search(read(p))
                  ]

                  if len(candidates) != 1:
                      if not existing:
                          unresolved.append(
                              assembly + ": " + name
                          )
                      continue

                  original = candidates[0]

                  if existing:

                      for file in existing:
                          if (
                              is_dummy(read(file))
                              or name == "PostEffectsBase"
                          ):
                              if file.stem == name:
                                  file.write_text(
                                      read(original),
                                      encoding="utf-8"
                                  )
                                  restored += 1

                                  print(
                                      "REPAIRED:",
                                      file
                                  )

                      continue

                  destination = (
                      target /
                      original.relative_to(source)
                  )

                  if destination.exists():
                      unresolved.append(
                          str(destination)
                      )
                      continue

                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  shutil.copyfile(
                      original,
                      destination
                  )

                  added += 1
                  print("ADDED:", destination)

          report = [
              f"Restored scripts: {restored}",
              f"Added original types: {added}",
              f"Unresolved types: {len(unresolved)}"
          ]

          report.extend(unresolved)

          Path("reports/v6-dependencies.txt").write_text(
              "\n".join(report) + "\n"
          )

          print("\n".join(report))
          PY

      - name: Restore Boo and UnityScript libraries
        run: |
          set -euo pipefail

          export PATH="$PWD/.coming-v6/venv/bin:$PATH"

          bash .coming-v6/download-original.sh

          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          assets = Path("ComingProject/Assets")

          target = assets / "Plugins/ComingLegacy"

          target.mkdir(
              parents=True,
              exist_ok=True
          )

          wanted = {
              "boo.lang.dll",
              "unityscript.lang.dll"
          }

          existing = {
              p.name.lower()
              for p in assets.rglob("*.dll")
          }

          with zipfile.ZipFile("Coming.zip") as archive:

              for member in archive.namelist():

                  name = Path(member).name

                  if name.lower() not in wanted:
                      continue

                  if name.lower() in existing:
                      continue

                  if "/managed/" not in (
                      "/" + member.lower()
                  ):
                      continue

                  (target / name).write_bytes(
                      archive.read(member)
                  )

                  existing.add(name.lower())

                  print("RESTORED DLL:", name)

          missing = wanted - existing

          print(
              "Missing legacy libraries:",
              sorted(missing)
          )

          Path("reports/v6-libraries.txt").write_text(
              "Missing: " + str(sorted(missing))
          )
          PY

          rm -f Coming.zip

      - name: V6 Fix NavMesh and legacy GUI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          assets = Path("ComingProject/Assets")

          fixed = 0

          for file in assets.rglob("*.cs"):

              text = file.read_text(
                  encoding="utf-8-sig"
              )

              old = text

              if file.name == "AICharacterControl.cs":

                  if "using UnityEngine.AI;" not in text:

                      text = (
                          "using UnityEngine.AI;\n"
                          + text
                      )

              if file.name in [
                  "FPSCounter.cs",
                  "SimpleActivatorMenu.cs",
                  "ForcedReset.cs"
              ]:

                  if re.search(r'\bGUIText\b', text):

                      text = text.replace(
                          "UnityEngine.GUIText",
                          "UnityEngine.UI.Text"
                      )

                      text = (
                          "using GUIText = "
                          "UnityEngine.UI.Text;\n"
                          + text
                      )

                  if re.search(r'\bGUITexture\b', text):

                      text = text.replace(
                          "UnityEngine.GUITexture",
                          "UnityEngine.UI.RawImage"
                      )

                      text = (
                          "using GUITexture = "
                          "UnityEngine.UI.RawImage;\n"
                          + text
                      )

              if old != text:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

                  fixed += 1

                  print("COMPATIBILITY FIX:", file)

          print("Compatibility files fixed:", fixed)
          PY

      - name: Preserve V5 CSharp fix
        run: bash .coming-v6/csharp.sh

      - name: Reconnect mobile controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          assets = Path("ComingProject/Assets")

          pattern = re.compile(
              r'(?<![\w.])(?:UnityEngine\.)?Input\.'
              r'(GetAxisRaw|GetAxis|GetKeyDown|GetKeyUp|'
              r'GetKey|GetButtonDown|GetButtonUp|'
              r'GetButton)\s*\('
          )

          fixed = 0

          for file in assets.rglob("*.cs"):

              if "ComingMobile" in file.parts:
                  continue

              text = file.read_text(
                  encoding="utf-8-sig"
              )

              if "Dummy class. This could have happened" in text:
                  continue

              if "using UnityEngine;" not in text:
                  continue

              if re.search(
                  r'using\s+Input\s*=',
                  text
              ):
                  continue

              updated, count = pattern.subn(
                  lambda m: (
                      "ComingTouch."
                      + m.group(1)
                      + "("
                  ),
                  text
              )

              if count:

                  file.write_text(
                      updated,
                      encoding="utf-8"
                  )

                  fixed += count

          print("Mobile input calls patched:", fixed)
          PY

      - name: Prepare Unity project
        run: bash .coming-v6/prepare.sh

      - name: Create Unity iOS builder
        run: bash .coming-v6/builder.sh

      - name: Enable iPhone Files access
        run: bash .coming-v6/files.sh

      - name: Check original scenes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          assets = Path("ComingProject/Assets")

          scenes = list(assets.rglob("*.unity"))
          animations = list(assets.rglob("*.anim"))

          if not scenes:
              raise RuntimeError(
                  "Original scenes missing"
              )

          print("Original scenes:", len(scenes))
          print("Animations:", len(animations))

          for scene in scenes:
              print("SCENE:", scene)

          Path("reports/v6-scenes.txt").write_text(
              f"Scenes: {len(scenes)}\n"
              f"Animations: {len(animations)}\n"
          )
          PY

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Unity CLI
        run: bash .coming-v6/cli.sh

      - name: Install Unity iOS module
        run: bash .coming-v6/install.sh

      - name: Verify Unity
        run: bash .coming-v6/verify.sh

      - name: Activate Unity Personal
        id: activate
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME || secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash .coming-v6/activate.sh

      - name: Unity iOS IL2CPP export
        run: bash .coming-v6/export.sh

      - name: Return Unity License
        if: always() && steps.activate.outcome == 'success'
        continue-on-error: true
        run: bash .coming-v6/return.sh

      - name: Find Xcode project
        run: bash .coming-v6/find.sh

      - name: Compile ARM64 iOS
        run: bash .coming-v6/xcode.sh

      - name: Create real IPA V6
        run: bash .coming-v6/ipa.sh

      - name: Protect IPA
        env:
          PASSWORD: ${{ secrets.COMING_ARCHIVE_PASSWORD }}
        run: bash .coming-v6/protect.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Coming-iOS-V6
          path: output/Coming-iOS-V6.7z
          retention-days: 7
          if-no-files-found: error

      - name: Upload V6 diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coming-V6-Diagnostics
          path: reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Final summary
        if: always()
        run: |
          for file in reports/v6-*.txt; do
            if [ -f "$file" ]; then
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ -f .coming-v6/summary.sh ]; then
            bash .coming-v6/summary.sh
          fi
