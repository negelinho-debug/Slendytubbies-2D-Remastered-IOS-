
name: Slendytubbies A New Story 1.2 - Preflight

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "GameJolt build ID (optional)"
        required: false
        type: string
      download_url:
        description: "Direct download URL (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GAME_ID: "748092"
      GAME_VERSION: "1.2"
      BUILD_ID: ${{ inputs.build_id }}
      DOWNLOAD_URL: ${{ inputs.download_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Prepare folders
        run: |
          mkdir -p original report

      - name: Download A New Story 1.2
        run: |
          set -euo pipefail

          if [ -n "$DOWNLOAD_URL" ]; then

            curl -fLsS --retry 2 \
              --max-time 500 \
              "$DOWNLOAD_URL" \
              -o game.archive

          else

            if [ -z "$BUILD_ID" ]; then

              curl -fLsS --retry 2 \
                -A 'Mozilla/5.0' \
                "https://gamejolt.com/site-api/web/discover/games/overview/$GAME_ID?ignore" \
                -o report/gamejolt.json

              BUILD_ID=$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(
              Path("report/gamejolt.json").read_text()
          )

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          records = list(walk(data))

          packages = {
              str(x["id"]): x
              for x in records
              if "id" in x
              and "title" in x
              and "game_id" in x
          }

          releases = {
              str(x["id"]): x
              for x in records
              if "id" in x
              and "version_number" in x
          }

          matches = set()
          candidates = []

          for build in records:

              if "id" not in build:
                  continue

              if not (
                  build.get("os_windows")
                  or build.get("os_windows_64")
              ):
                  continue

              package = packages.get(
                  str(build.get("game_package_id")),
                  {}
              )

              release = releases.get(
                  str(build.get("game_release_id")),
                  {}
              )

              title = str(package.get("title", ""))

              version = str(
                  release.get("version_number", "")
              )

              description = " ".join([
                  title,
                  str(package.get("description", "")),
                  version,
                  str(build.get("filename", ""))
              ])

              candidates.append(
                  str(build["id"]) +
                  " | " + title +
                  " | " + version
              )

              if re.search(
                  r"(?<![\d.])1\.2(?:\.0)?(?![\d.])",
                  description
              ):
                  matches.add(str(build["id"]))

          Path("report/builds.txt").write_text(
              "\n".join(candidates)
          )

          if len(matches) != 1:
              raise SystemExit(
                  "Version 1.2 not uniquely identified. "
                  "Check builds.txt. Candidates: " +
                  str(candidates)
              )

          print(matches.pop())
          PY
              )

            fi

            echo "Selected build: $BUILD_ID"

            API="https://gamejolt.com/site-api/web/discover/games/builds/get-download-url/$BUILD_ID"

            URL=$(curl -fsS --retry 2 \
              -A 'Mozilla/5.0' \
              -H 'Content-Type: application/json' \
              -H "Referer: https://gamejolt.com/get/build?game=$GAME_ID&build=$BUILD_ID" \
              --data '{"forceDownload":true}' \
              "$API" | jq -er '.payload.url')

            curl -fLsS --retry 2 \
              --max-time 500 \
              -A 'Mozilla/5.0' \
              -e 'https://gamejolt.com/' \
              "$URL" \
              -o game.archive

          fi

          test -s game.archive

          ls -lh game.archive

          file game.archive

          sha256sum game.archive \
            > report/sha256.txt

      - name: Extract original game
        run: |
          set -euo pipefail

          7z l game.archive \
            > report/archive-files.txt

          7z x -y \
            -ooriginal \
            game.archive

      - name: Check game engine and Unity version
        run: |
          set -euo pipefail

          python3 - <<'PY' | tee report/engine.txt
          from pathlib import Path
          import re
          import shutil

          root = Path("original")

          assemblies = list(
              root.rglob("Assembly-CSharp.dll")
          )

          unity = list(
              root.rglob("globalgamemanagers")
          )

          il2cpp = list(
              root.rglob("GameAssembly.dll")
          )

          metadata = list(
              root.rglob("global-metadata.dat")
          )

          print("A NEW STORY PREFLIGHT")
          print("====================")

          print("Requested game version: 1.2")

          if unity or assemblies or il2cpp:
              print("Engine: Unity")
          else:
              print("Engine: Unknown")

          versions = set()

          for path in root.rglob("*"):

              if not path.is_file():
                  continue

              if (
                  path.name.lower() not in {
                      "globalgamemanagers",
                      "unityplayer.dll",
                      "maindata",
                      "data.unity3d"
                  }
                  and path.suffix.lower() not in {
                      ".assets", ".exe"
                  }
              ):
                  continue

              with path.open("rb") as stream:
                  data = stream.read(4194304)

              for version in re.findall(
                  rb"(?:20\d{2}|6000|[345])\.\d+\.\d+[abfp]\d+",
                  data
              ):
                  versions.add(version.decode())

          print(
              "Unity versions:",
              sorted(versions)
          )

          print("Managed DLLs:", len(assemblies))

          print("IL2CPP:", bool(il2cpp or metadata))

          if assemblies and not il2cpp and not metadata:

              print("Backend: Mono")

              print("PORT STATUS: MONO CANDIDATE")

              for index, assembly in enumerate(assemblies):

                  print(
                      "Original assembly:",
                      assembly,
                      assembly.stat().st_size,
                      "bytes"
                  )

                  shutil.copy2(
                      assembly,
                      Path("report") /
                      f"Assembly-CSharp-original-{index}.dll"
                  )

          elif il2cpp or metadata:

              print("Backend: IL2CPP")

              print("PORT STATUS: MORE ANALYSIS REQUIRED")

          else:

              print("PORT STATUS: UNKNOWN")

          size = sum(
              path.stat().st_size
              for path in root.rglob("*")
              if path.is_file()
          )

          print(
              "Extracted size:",
              round(size / 1024 / 1024, 2),
              "MB"
          )
          PY

      - name: Check original scenes
        run: |
          find original -type f \
            \( -name 'level*' \
            -o -name '*.unity' \
            -o -name '*.assets' \
            -o -name '*.bundle' \
            -o -name '*.resource' \
            -o -name '*.resS' \) \
            | sort > report/scenes.txt

          cat report/scenes.txt

      - name: Check libraries
        run: |
          find original -type f \
            -iname '*.dll' \
            | sort > report/libraries.txt

          cat report/libraries.txt

      - name: Check campaign scripts
        run: |
          python3 - <<'PY' | tee report/campaign.txt
          from pathlib import Path
          import re

          terms = [
              "chapter",
              "campaign",
              "story",
              "dialog",
              "choice",
              "cutscene",
              "player",
              "controller",
              "input",
              "save",
              "load",
              "inventory",
              "flashlight",
              "sprint",
              "crouch",
              "jump",
              "checkpoint",
              "scene"
          ]

          for path in Path("original").rglob(
              "Assembly-CSharp.dll"
          ):

              print("Assembly:", path)

              found = set()

              for item in re.findall(
                  rb"[A-Za-z_][A-Za-z0-9_.]{3,100}",
                  path.read_bytes()
              ):

                  name = item.decode(
                      "ascii",
                      errors="ignore"
                  )

                  if any(
                      term in name.lower()
                      for term in terms
                  ):
                      found.add(name)

              for name in sorted(found):
                  print(name)
          PY

      - name: Create final report
        if: always()
        run: |
          {
            echo "# A New Story 1.2"
            echo ""
            echo '```'
            cat report/engine.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "## Available builds"
            echo '```'
            cat report/builds.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "No Unity installation"
            echo "No Recovery"
            echo "No Xcode compilation"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-New-Story-Preflight
          path: report/
          retention-days: 14

      - name: Preserve downloaded original
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A-New-Story-Original
          path: game.archive
          compression-level: 0
          retention-days: 14
