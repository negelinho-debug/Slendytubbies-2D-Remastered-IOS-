name: Apocalypse Exclusive Alpha iOS Fix 2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 150

    env:
      UNITY_EDITOR_PATH: /Applications/Unity/Unity.app/Contents/MacOS/Unity
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      V1_COMMIT: 7987483d3f5c71816429b62b8aca9e28df8ecc7f
      FIX1_COMMIT: 631b34e617f6f52d55eb400561ee7f318b410960

    steps:
      - uses: actions/checkout@v5
        with:
          ref: 631b34e617f6f52d55eb400561ee7f318b410960

      - name: Restore Fix 1 scripts
        run: |
          set -euo pipefail

          mkdir -p .fix2 logs recovery dist

          git fetch --no-tags --depth=1 origin "$V1_COMMIT"

          git show "$FIX1_COMMIT:.github/workflows/apocalypse-alpha-ios.yml" \
            > .fix2/fix1.yml

          python3 -m venv "$RUNNER_TEMP/fix2-python"

          "$RUNNER_TEMP/fix2-python/bin/pip" install pyyaml

          "$RUNNER_TEMP/fix2-python/bin/python" - <<'PY'
          import yaml
          from pathlib import Path

          root = Path(".fix2")

          data = yaml.safe_load(
              (root / "fix1.yml").read_text()
          )

          steps = data["jobs"]["ipa"]["steps"]

          names = {
              "Restore original build scripts": "restore.sh",
              "Download Alpha Recovery": "download.sh",
              "Install Unity and iOS support": "install.sh",
              "Fix 1 - Find Unity libraries": "references.sh",
              "Activate Unity Personal": "activate.sh",
              "Prepare English Russian Ukrainian": "languages.sh",
              "Build mobile controls Fix 1": "mobile.sh",
              "Connect controls to original game": "connect.sh",
              "Repair original script references": "repair.sh",
              "Prepare original Chapter 1": "prepare.sh",
              "Export Unity to Xcode": "export.sh",
              "Return Unity license": "return.sh",
              "Build ARM64 application": "xcode.sh",
              "Create Exclusive Alpha IPA": "ipa.sh"
          }

          for name, filename in names.items():
              matches = [
                  s for s in steps
                  if s.get("name") == name
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      "Missing step: " + name
                  )

              (root / filename).write_text(
                  matches[0]["run"]
              )

              print("Restored:", name)
          PY

          for SCRIPT in .fix2/*.sh; do
            bash -n "$SCRIPT"
          done

          bash -e .fix2/restore.sh

      - name: Download original Chapter 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash -e .fix2/download.sh

          test -s ExportedProject/Assets/Scenes/DLC/MenuAlpha.unity

          test -s ExportedProject/Assets/Scenes/DLC/Alphas/CH1P1.unity

      - name: Install Unity 2021 and iOS support
        timeout-minutes: 40
        run: |
          bash -e .fix2/install.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Unity reference libraries
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash -e .fix2/references.sh

          test -s .alpha-ci/UnityReferences/UnityEngine.CoreModule.dll

          echo "Unity references available"

      - name: Fix 2 - Repair Mono Cecil resolver
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          file = Path(".alpha-ci/input.sh")

          script = file.read_text()

          marker = "using var game ="

          if script.count(marker) != 1:
              raise SystemExit(
                  "Original Cecil reader not found"
              )

          resolver = '''
          using var resolver = new DefaultAssemblyResolver();

          resolver.AddSearchDirectory(
              Path.GetFullPath(dir)
          );

          resolver.AddSearchDirectory(
              Path.GetFullPath(
                  ".alpha-ci/UnityReferences"
              )
          );

          string unity = "/Applications/Unity";

          if (Directory.Exists(unity))
          {
              foreach (string assembly in
                  Directory.EnumerateFiles(
                      unity,
                      "mscorlib.dll",
                      SearchOption.AllDirectories
                  ))
              {
                  string folder =
                      Path.GetDirectoryName(assembly);

                  if (!string.IsNullOrEmpty(folder))
                      resolver.AddSearchDirectory(folder);
              }
          }

          Console.WriteLine(
              "Mono.Cecil Unity dependencies configured"
          );

          '''

          script = script.replace(
              marker,
              resolver + marker,
              1
          )

          old = "new ReaderParameters { InMemory = true }"

          new = (
              "new ReaderParameters { "
              "InMemory = true, "
              "AssemblyResolver = resolver "
              "}"
          )

          if script.count(old) != 1:
              raise SystemExit(
                  "Original reader parameters not found"
              )

          script = script.replace(old, new, 1)

          file.write_text(script)

          print("Mono.Cecil resolver Fix 2 applied")
          PY

          bash -n .alpha-ci/input.sh

      - name: Activate Unity Personal
        id: activate
        timeout-minutes: 10
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME || secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          bash -e .fix2/activate.sh

      - name: Prepare English Russian Ukrainian
        run: |
          set -euo pipefail

          bash -e .fix2/languages.sh \
            2>&1 | tee logs/languages-fix2.txt

          test -s ExportedProject/Assets/Resources/AlphaTranslations.json

      - name: Build mobile controls
        timeout-minutes: 15
        run: |
          set -euo pipefail

          bash -e .fix2/mobile.sh

          test -s ExportedProject/Assets/Plugins/AlphaMobile.dll

          echo "Mobile controls compiled"

      - name: Connect controls to original game Fix 2
        timeout-minutes: 15
        run: |
          set -euo pipefail

          bash -e .fix2/connect.sh \
            2>&1 | tee logs/cecil-fix2.txt

          test -s ExportedProject/Assets/Plugins/ApocalypseAlpha.dll

          echo "Original game input patched successfully"

      - name: Repair original scene references
        run: |
          set -euo pipefail

          bash -e .fix2/repair.sh

          test -s ExportedProject/Assets/Plugins/ApocalypseAlpha.dll

          test -s ExportedProject/Assets/Plugins/ApocalypseAlpha.dll.meta

          test -s ExportedProject/Assets/link.xml

      - name: Prepare original Chapter 1
        run: |
          set -euo pipefail

          bash -e .fix2/prepare.sh

          test -s ExportedProject/Assets/Editor/AlphaCI/BuildAlpha.cs

      - name: Export Unity project to Xcode
        timeout-minutes: 70
        run: |
          set -euo pipefail

          bash -e .fix2/export.sh

          test -s Xcode/Unity-iPhone.xcodeproj/project.pbxproj

          echo "Unity iOS export successful"

      - name: Return Unity license
        if: always() && steps.activate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          bash -e .fix2/return.sh

      - name: Build ARM64 application
        timeout-minutes: 45
        run: |
          set -euo pipefail

          bash -e .fix2/xcode.sh

      - name: Create Exclusive Alpha Fix 2 IPA
        run: |
          set -euo pipefail

          bash -e .fix2/ipa.sh

          test -s dist/Apocalypse-Alpha-CH1P1-Fix1.ipa

          mv dist/Apocalypse-Alpha-CH1P1-Fix1.ipa \
            dist/Apocalypse-Alpha-CH1P1-Fix2.ipa

          unzip -tq \
            dist/Apocalypse-Alpha-CH1P1-Fix2.ipa

          ls -lh dist/

          echo "Exclusive Alpha Fix 2 IPA created" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Exclusive Alpha IPA
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Alpha-CH1P1-Fix2
          path: dist/*.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Alpha-Fix2-Logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14
