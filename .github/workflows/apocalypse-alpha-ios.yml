name: Apocalypse Exclusive Alpha iOS Fix 3

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 150

    env:
      UNITY_EDITOR_PATH: /Applications/Unity/Unity.app/Contents/MacOS/Unity
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      V1_COMMIT: 7987483d3f5c71816429b62b8aca9e28df8ecc7f
      FIX1_COMMIT: 631b34e617f6f52d55eb400561ee7f318b410960
      FIX2_COMMIT: 6a9f9200b8165370e9917f352c5988be57a95700

    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6a9f9200b8165370e9917f352c5988be57a95700

      - name: Restore complete Fix 2
        run: |
          set -euo pipefail

          mkdir -p .fix3 logs recovery dist

          git fetch --no-tags --depth=1 origin "$FIX1_COMMIT"
          git fetch --no-tags --depth=1 origin "$V1_COMMIT"

          git show "$FIX2_COMMIT:.github/workflows/apocalypse-alpha-ios.yml" \
            > .fix3/fix2.yml

          python3 -m venv "$RUNNER_TEMP/fix3-python"

          "$RUNNER_TEMP/fix3-python/bin/pip" install pyyaml

          "$RUNNER_TEMP/fix3-python/bin/python" - <<'PY'
          import yaml
          from pathlib import Path

          root = Path(".fix3")

          data = yaml.safe_load(
              (root / "fix2.yml").read_text()
          )

          steps = data["jobs"]["ipa"]["steps"]

          scripts = {
              "Restore Fix 1 scripts": "restore.sh",
              "Download original Chapter 1": "download.sh",
              "Install Unity 2021 and iOS support": "install.sh",
              "Restore Unity reference libraries": "references.sh",
              "Fix 2 - Repair Mono Cecil resolver": "resolver.sh",
              "Activate Unity Personal": "activate.sh",
              "Prepare English Russian Ukrainian": "languages.sh",
              "Build mobile controls": "mobile.sh",
              "Connect controls to original game Fix 2": "connect.sh",
              "Repair original scene references": "repair.sh",
              "Prepare original Chapter 1": "prepare.sh",
              "Export Unity project to Xcode": "export.sh",
              "Return Unity license": "return.sh",
              "Build ARM64 application": "xcode.sh",
              "Create Exclusive Alpha Fix 2 IPA": "ipa.sh"
          }

          for name, filename in scripts.items():
              matches = [
                  s for s in steps
                  if s.get("name") == name
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      "Missing previous step: " + name
                  )

              (root / filename).write_text(
                  matches[0]["run"]
              )

              print("Restored:", name)

          PY

          for SCRIPT in .fix3/*.sh; do
            bash -n "$SCRIPT"
          done

          bash -e .fix3/restore.sh

      - name: Download original Alpha Recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash -e .fix3/download.sh

          test -s ExportedProject/Assets/Scenes/DLC/MenuAlpha.unity

          test -s ExportedProject/Assets/Scenes/DLC/Alphas/CH1P1.unity

          echo "Original Chapter 1 Part 1 confirmed"

      - name: Install Unity and iOS support
        timeout-minutes: 40
        run: |
          bash -e .fix3/install.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Unity libraries
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash -e .fix3/references.sh

          test -s .alpha-ci/UnityReferences/UnityEngine.CoreModule.dll

      - name: Preserve Mono Cecil Fix 2
        run: |
          set -euo pipefail

          bash -e .fix3/resolver.sh

      - name: Activate Unity Personal
        id: activate
        timeout-minutes: 10
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME || secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          bash -e .fix3/activate.sh

      - name: Prepare three languages
        run: |
          set -euo pipefail

          bash -e .fix3/languages.sh

          test -s ExportedProject/Assets/Resources/AlphaTranslations.json

      - name: Compile original mobile controls
        timeout-minutes: 15
        run: |
          set -euo pipefail

          bash -e .fix3/mobile.sh

          test -s ExportedProject/Assets/Plugins/AlphaMobile.dll

      - name: Connect mobile controls
        timeout-minutes: 15
        run: |
          set -euo pipefail

          bash -e .fix3/connect.sh

          test -s ExportedProject/Assets/Plugins/ApocalypseAlpha.dll

      - name: Repair original scene references
        run: |
          set -euo pipefail

          bash -e .fix3/repair.sh

      - name: Fix 3 - Repair TextCore and TextMeshPro
        timeout-minutes: 15
        run: |
          set -euo pipefail

          dotnet new console \
            -o textcorefix \
            --framework net8.0

          dotnet add textcorefix package Mono.Cecil \
            --version 0.11.6

          cat > textcorefix/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using Mono.Cecil;

          string plugins = Path.GetFullPath(args[0]);
          string references = Path.GetFullPath(args[1]);

          const string oldModule =
              "UnityEngine.TextCoreModule";

          using var resolver =
              new DefaultAssemblyResolver();

          resolver.AddSearchDirectory(plugins);
          resolver.AddSearchDirectory(references);

          foreach (string path in Directory.EnumerateFiles(
              "/Applications/Unity",
              "mscorlib.dll",
              SearchOption.AllDirectories))
          {
              string folder = Path.GetDirectoryName(path);

              if (!string.IsNullOrEmpty(folder))
                  resolver.AddSearchDirectory(folder);
          }

          var parameters = new ReaderParameters
          {
              InMemory = true,
              AssemblyResolver = resolver
          };

          var destinations =
              new Dictionary<string, string>();

          var modules = Directory
              .GetFiles(references, "UnityEngine.TextCore*Module.dll")
              .Where(p =>
                  Path.GetFileNameWithoutExtension(p) !=
                  oldModule)
              .ToArray();

          if (modules.Length == 0)
              throw new Exception(
                  "Modern TextCore modules not found"
              );

          foreach (string file in modules)
          {
              using var engine =
                  AssemblyDefinition.ReadAssembly(
                      file, parameters
                  );

              foreach (var type in engine.MainModule.Types)
              {
                  destinations[type.FullName] =
                      engine.Name.FullName;
              }

              Console.WriteLine(
                  "Modern module: " + engine.Name.Name
              );
          }

          int total = 0;
          int patchedAssemblies = 0;

          foreach (string path in
              Directory.GetFiles(plugins, "*.dll"))
          {
              using var assembly =
                  AssemblyDefinition.ReadAssembly(
                      path, parameters
                  );

              var module = assembly.MainModule;

              var obsolete = module.AssemblyReferences
                  .Where(a => a.Name == oldModule)
                  .ToArray();

              if (obsolete.Length == 0)
                  continue;

              var types = module.GetTypeReferences()
                  .Where(t =>
                      t.Scope is AssemblyNameReference a &&
                      a.Name == oldModule)
                  .ToArray();

              int changed = 0;

              foreach (var type in types)
              {
                  if (!destinations.TryGetValue(
                      type.FullName,
                      out string destination))
                  {
                      throw new Exception(
                          "Unresolved TextCore type: " +
                          type.FullName +
                          " in " + assembly.Name.Name
                      );
                  }

                  var parsed =
                      AssemblyNameReference.Parse(
                          destination
                      );

                  var target =
                      module.AssemblyReferences
                      .FirstOrDefault(a =>
                          a.Name == parsed.Name
                      );

                  if (target == null)
                  {
                      target = parsed;
                      module.AssemblyReferences.Add(
                          target
                      );
                  }

                  type.Scope = target;

                  Console.WriteLine(
                      type.FullName + " -> " +
                      target.Name
                  );

                  changed++;
              }

              foreach (var reference in obsolete)
                  module.AssemblyReferences.Remove(
                      reference
                  );

              string temporary = path + ".patched";

              assembly.Write(temporary);

              using (var check =
                  AssemblyDefinition.ReadAssembly(
                      temporary,
                      parameters
                  ))
              {
                  if (check.MainModule.AssemblyReferences
                      .Any(a => a.Name == oldModule))
                  {
                      throw new Exception(
                          "Legacy TextCore reference remains"
                      );
                  }
              }

              File.Move(temporary, path, true);

              Console.WriteLine(
                  "Patched: " +
                  Path.GetFileName(path) +
                  " | types: " + changed
              );

              total += changed;
              patchedAssemblies++;
          }

          if (patchedAssemblies == 0)
              throw new Exception(
                  "Expected legacy TextCore references"
              );

          Console.WriteLine(
              "Patched assemblies: " +
              patchedAssemblies
          );

          Console.WriteLine(
              "Total TextCore references repaired: " +
              total
          );

          CS

          dotnet run --project textcorefix -- \
            "$PWD/ExportedProject/Assets/Plugins" \
            "$PWD/.alpha-ci/UnityReferences" \
            2>&1 | tee logs/textcore-fix3.txt

          test -s ExportedProject/Assets/Plugins/Unity.TextMeshPro.dll

          test -s ExportedProject/Assets/Plugins/ApocalypseAlpha.dll

          echo "TextCore migration completed" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Check original scene integrity
        run: |
          set -euo pipefail

          python3 - <<'PY' | tee logs/scene-integrity.txt
          from pathlib import Path
          import re

          project = Path("ExportedProject")

          scenes = [
              project / "Assets/Scenes/DLC/MenuAlpha.unity",
              project / "Assets/Scenes/DLC/Alphas/CH1P1.unity"
          ]

          for scene in scenes:
              content = scene.read_text()

              missing = len(re.findall(
                  r"(?m)^\s*m_Script:\s*\{fileID: 0\}",
                  content
              ))

              print(
                  scene.name,
                  "Original empty references:",
                  missing
              )

          print(
              "Original scene objects preserved."
          )
          PY

      - name: Prepare original Chapter 1
        run: |
          set -euo pipefail

          bash -e .fix3/prepare.sh

          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "ExportedProject/Assets/Editor/"
              "AlphaCI/BuildAlpha.cs"
          )

          source = file.read_text()

          old = '''
                      missing += GameObjectUtility
                          .GetMonoBehavioursWithMissingScriptCount(
                              t.gameObject
                          );
          '''

          new = '''
                      int count = GameObjectUtility
                          .GetMonoBehavioursWithMissingScriptCount(
                              t.gameObject
                          );

                      if (count > 0)
                          Debug.LogWarning(
                              "Missing original component: " +
                              scene.name + "/" +
                              t.gameObject.name +
                              " count=" + count
                          );

                      missing += count;
          '''

          if old.strip() in source:
              source = source.replace(
                  old.strip(),
                  new.strip(),
                  1
              )

          marker = 'PlayerSettings.productName ='

          if marker not in source:
              raise SystemExit(
                  "Original build settings not found"
              )

          source = source.replace(
              marker,
              '''
              EditorSceneManager.NewScene(
                  NewSceneSetup.EmptyScene,
                  NewSceneMode.Single
              );

              ''' + marker,
              1
          )

          file.write_text(source)

          print("Scene diagnostics prepared")
          PY

          test -s ExportedProject/Assets/Editor/AlphaCI/BuildAlpha.cs

      - name: Export Unity project to Xcode
        timeout-minutes: 70
        run: |
          set -euo pipefail

          if ! bash -e .fix3/export.sh; then

            echo "===== UNITY ERRORS ====="

            if [ -f logs/unity.log ]; then
              grep -Ei \
                'error|exception|failed|missing scripts' \
                logs/unity.log \
                | cut -c1-1500 \
                | tail -n 100 || true
            fi

            exit 1
          fi

          test -s Xcode/Unity-iPhone.xcodeproj/project.pbxproj

          echo "Unity export completed" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Return Unity license
        if: always() && steps.activate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          bash -e .fix3/return.sh

      - name: Build ARM64 application
        timeout-minutes: 45
        run: |
          set -euo pipefail

          bash -e .fix3/xcode.sh

      - name: Create Exclusive Alpha Fix 3 IPA
        run: |
          set -euo pipefail

          bash -e .fix3/ipa.sh

          test -s dist/Apocalypse-Alpha-CH1P1-Fix2.ipa

          mv dist/Apocalypse-Alpha-CH1P1-Fix2.ipa \
            dist/Apocalypse-Alpha-CH1P1-Fix3.ipa

          unzip -tq \
            dist/Apocalypse-Alpha-CH1P1-Fix3.ipa

          ls -lh dist/

          echo "Exclusive Alpha Fix 3 IPA created" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Exclusive Alpha IPA
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Alpha-CH1P1-Fix3
          path: dist/*.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Alpha-Fix3-Logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14
