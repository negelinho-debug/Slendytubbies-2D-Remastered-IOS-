
name: Apocalypse Alpha Fix 4 - Location Selection IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 150

    env:
      UNITY_EDITOR_PATH: /Applications/Unity/Unity.app/Contents/MacOS/Unity
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      V1_COMMIT: 7987483d3f5c71816429b62b8aca9e28df8ecc7f
      FIX1_COMMIT: 631b34e617f6f52d55eb400561ee7f318b410960
      FIX2_COMMIT: 6a9f9200b8165370e9917f352c5988be57a95700
      FIX3_COMMIT: 9b3bdc3644ed0597b42077e5069ffbabde97b17c

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore working Fix 3
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/location-fix"

          git fetch --no-tags --depth=1 origin "$FIX3_COMMIT"

          git show "$FIX3_COMMIT:.github/workflows/apocalypse-alpha-ios.yml" \
            > "$RUNNER_TEMP/location-fix/fix3.yml"

          python3 -m venv "$RUNNER_TEMP/location-python"

          "$RUNNER_TEMP/location-python/bin/pip" install pyyaml

          "$RUNNER_TEMP/location-python/bin/python" - <<'PY'
          import os
          import yaml
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "location-fix"

          workflow = yaml.safe_load(
              (root / "fix3.yml").read_text()
          )

          steps = workflow["jobs"]["ipa"]["steps"]

          scripts = {
              "Restore complete Fix 2": "restore.sh",
              "Download original Alpha Recovery": "download.sh",
              "Install Unity and iOS support": "install.sh",
              "Restore Unity libraries": "references.sh",
              "Preserve Mono Cecil Fix 2": "resolver.sh",
              "Activate Unity Personal": "activate.sh",
              "Prepare three languages": "languages.sh",
              "Compile original mobile controls": "mobile.sh",
              "Connect mobile controls": "connect.sh",
              "Repair original scene references": "repair.sh",
              "Fix 3 - Repair TextCore and TextMeshPro": "textcore.sh",
              "Check original scene integrity": "integrity.sh",
              "Prepare original Chapter 1": "prepare.sh",
              "Export Unity project to Xcode": "export.sh",
              "Return Unity license": "return.sh",
              "Build ARM64 application": "xcode.sh",
              "Create Exclusive Alpha Fix 3 IPA": "ipa.sh"
          }

          for name, filename in scripts.items():

              matches = [
                  s for s in steps
                  if s.get("name") == name
              ]

              if len(matches) != 1:
                  raise RuntimeError(
                      "Missing Fix 3 step: " + name
                  )

              (root / filename).write_text(
                  matches[0]["run"]
              )

              print("Restored:", name)

          PY

          for SCRIPT in "$RUNNER_TEMP/location-fix/"*.sh; do
            bash -n "$SCRIPT"
          done

          git fetch --no-tags --depth=1 origin "$FIX2_COMMIT"

          git checkout --detach "$FIX2_COMMIT"

          bash -e "$RUNNER_TEMP/location-fix/restore.sh"

      - name: Download existing Alpha project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash -e "$RUNNER_TEMP/location-fix/download.sh"

          test -s ExportedProject/Assets/Scenes/DLC/MenuAlpha.unity

          test -s ExportedProject/Assets/Scenes/DLC/Alphas/CH1P1.unity

          echo "Existing original Alpha project loaded"

          echo "No new Recovery required"

      - name: Install Unity 2021 and iOS support
        timeout-minutes: 40
        run: |
          bash -e "$RUNNER_TEMP/location-fix/install.sh"

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Unity references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash -e "$RUNNER_TEMP/location-fix/references.sh"

      - name: Preserve Mono Cecil resolver
        run: |
          bash -e "$RUNNER_TEMP/location-fix/resolver.sh"

      - name: Activate Unity Personal
        id: activate
        timeout-minutes: 10
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME || secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          bash -e "$RUNNER_TEMP/location-fix/activate.sh"

      - name: Preserve English Russian Ukrainian
        run: |
          bash -e "$RUNNER_TEMP/location-fix/languages.sh"

      - name: Preserve mobile controls
        run: |
          bash -e "$RUNNER_TEMP/location-fix/mobile.sh"

      - name: Connect original game controls
        run: |
          bash -e "$RUNNER_TEMP/location-fix/connect.sh"

      - name: Repair original references
        run: |
          bash -e "$RUNNER_TEMP/location-fix/repair.sh"

      - name: Preserve TextCore Fix 3
        run: |
          bash -e "$RUNNER_TEMP/location-fix/textcore.sh"

      - name: Verify original scenes
        run: |
          bash -e "$RUNNER_TEMP/location-fix/integrity.sh"

      - name: Prepare original Chapter 1
        run: |
          bash -e "$RUNNER_TEMP/location-fix/prepare.sh"

      - name: Fix 4 - Custard Location Selection
        run: |
          set -euo pipefail

          mkdir -p ExportedProject/Assets/AlphaLocationFix

          cat > ExportedProject/Assets/AlphaLocationFix/AlphaLocations.cs <<'CS'
          using System;
          using System.IO;
          using System.Collections.Generic;
          using System.Text.RegularExpressions;
          using UnityEngine;
          using UnityEngine.UI;
          using UnityEngine.SceneManagement;
          using TMPro;

          public sealed class AlphaLocations : MonoBehaviour
          {
              private static AlphaLocations instance;

              private Font font;

              private GUIStyle labelStyle;

              private float nextScan;

              private string logPath;

              private readonly HashSet<string> logged =
                  new HashSet<string>();

              private readonly Dictionary<int, Transform> markers =
                  new Dictionary<int, Transform>();

              private static readonly string[,] names = {
                  {
                      "Lake",
                      "Tubby House",
                      "Dry tree"
                  },
                  {
                      "Озеро",
                      "Дом телепузиков",
                      "Сухое дерево"
                  },
                  {
                      "Озеро",
                      "Будинок телепузиків",
                      "Сухе дерево"
                  }
              };

              [RuntimeInitializeOnLoadMethod(
                  RuntimeInitializeLoadType.BeforeSceneLoad)]
              private static void Install()
              {
                  if (Application.platform !=
                      RuntimePlatform.IPhonePlayer)
                      return;

                  if (instance != null)
                      return;

                  GameObject root =
                      new GameObject("Alpha Location Fix 4");

                  DontDestroyOnLoad(root);

                  instance =
                      root.AddComponent<AlphaLocations>();
              }

              private void Awake()
              {
                  font = Resources.Load<Font>(
                      "AlphaMobileFont"
                  );

                  logPath = Path.Combine(
                      Application.persistentDataPath,
                      "AlphaLocationFix.txt"
                  );

                  Write("Location Fix 4 installed");
              }

              private void Write(string message)
              {
                  try
                  {
                      if (File.Exists(logPath) &&
                          new FileInfo(logPath).Length > 1048576)
                      {
                          File.WriteAllText(logPath, "");
                      }

                      File.AppendAllText(
                          logPath,
                          DateTime.Now +
                          " " + message + "\n"
                      );
                  }
                  catch {}
              }

              private string Normalize(string value)
              {
                  if (string.IsNullOrEmpty(value))
                      return "";

                  value = Regex.Replace(
                      value,
                      "<[^>]+>",
                      ""
                  );

                  value = value.Trim().ToLowerInvariant();

                  return Regex.Replace(
                      value,
                      @"[\s_\-]+",
                      ""
                  );
              }

              private int LocationId(string value)
              {
                  value = Normalize(value);

                  switch (value)
                  {
                      case "lake":
                      case "lago":
                      case "озеро":
                          return 0;

                      case "tubbyhouse":
                      case "casateletubbie":
                      case "домтелепузиков":
                      case "будиноктелепузиків":
                          return 1;

                      case "drytree":
                      case "arbolseco":
                      case "árbolseco":
                      case "сухоедерево":
                      case "сухедерево":
                          return 2;
                  }

                  return -1;
              }

              private int LocationFromObject(
                  Transform target
              )
              {
                  for (int i = 0;
                       i < 3 && target != null;
                       i++)
                  {
                      int id = LocationId(target.name);

                      if (id >= 0)
                          return id;

                      target = target.parent;
                  }

                  return -1;
              }

              private bool IsActive(Component component)
              {
                  if (component == null ||
                      !component.gameObject.activeInHierarchy)
                      return false;

                  foreach (CanvasGroup group in
                      component.GetComponentsInParent<CanvasGroup>())
                  {
                      if (group.alpha < 0.02f)
                          return false;

                      if (group.ignoreParentGroups)
                          break;
                  }

                  return true;
              }

              private void Register(
                  Component component,
                  string text
              )
              {
                  if (!IsActive(component))
                      return;

                  string key =
                      component.GetType().Name + "/" +
                      component.gameObject.name + "/" +
                      text;

                  if (logged.Add(key))
                  {
                      Write("Active label: " + key);
                  }

                  int id = LocationId(text);

                  if (id < 0)
                  {
                      id = LocationFromObject(
                          component.transform
                      );
                  }

                  if (id < 0)
                      return;

                  if (!markers.ContainsKey(id))
                  {
                      markers.Add(
                          id,
                          component.transform
                      );
                  }
              }

              private void Update()
              {
                  if (Time.unscaledTime < nextScan)
                      return;

                  nextScan = Time.unscaledTime + 0.25f;

                  markers.Clear();

                  Scene scene =
                      SceneManager.GetActiveScene();

                  if (!scene.isLoaded ||
                      scene.name != "CH1P1")
                      return;

                  foreach (GameObject root in
                      scene.GetRootGameObjects())
                  {
                      if (!root.activeInHierarchy)
                          continue;

                      foreach (Text text in
                          root.GetComponentsInChildren<Text>(false))
                      {
                          if (text.isActiveAndEnabled)
                              Register(text, text.text);
                      }

                      foreach (TMP_Text text in
                          root.GetComponentsInChildren<TMP_Text>(false))
                      {
                          if (text.isActiveAndEnabled)
                              Register(text, text.text);
                      }

                      foreach (TextMesh text in
                          root.GetComponentsInChildren<TextMesh>(false))
                      {
                          Register(text, text.text);
                      }

                      foreach (Button button in
                          root.GetComponentsInChildren<Button>(false))
                      {
                          if (!button.isActiveAndEnabled)
                              continue;

                          if (!button.interactable)
                              continue;

                          Register(button, button.name);

                          foreach (Text label in
                              button.GetComponentsInChildren<Text>(true))
                          {
                              Register(button, label.text);
                          }

                          foreach (TMP_Text label in
                              button.GetComponentsInChildren<TMP_Text>(true))
                          {
                              Register(button, label.text);
                          }
                      }
                  }

                  if (markers.Count >= 2 &&
                      logged.Add("Location selection detected"))
                  {
                      Write("Original location selection detected");
                  }
              }

              private int Language()
              {
                  string language = PlayerPrefs.GetString(
                      "alpha.language",
                      "en"
                  );

                  if (language == "ru")
                      return 1;

                  if (language == "uk" ||
                      language == "ua")
                      return 2;

                  return 0;
              }

              private Camera FindCamera()
              {
                  Camera camera = Camera.main;

                  if (camera != null &&
                      camera.isActiveAndEnabled)
                      return camera;

                  foreach (Camera item in Camera.allCameras)
                  {
                      if (item.isActiveAndEnabled &&
                          item.cameraType == CameraType.Game)
                          return item;
                  }

                  return null;
              }

              private bool ScreenPosition(
                  Transform target,
                  out Vector2 point
              )
              {
                  point = Vector2.zero;

                  if (target == null ||
                      !target.gameObject.activeInHierarchy)
                      return false;

                  RectTransform rect =
                      target as RectTransform;

                  Canvas canvas =
                      target.GetComponentInParent<Canvas>();

                  if (rect != null && canvas != null)
                  {
                      Camera camera = null;

                      if (canvas.renderMode !=
                          RenderMode.ScreenSpaceOverlay)
                      {
                          camera = canvas.worldCamera;

                          if (camera == null)
                              camera = FindCamera();

                          if (camera == null)
                              return false;
                      }

                      Vector3 world =
                          rect.TransformPoint(
                              rect.rect.center
                          );

                      if (camera != null &&
                          camera.WorldToScreenPoint(world).z <= 0)
                          return false;

                      point =
                          RectTransformUtility.WorldToScreenPoint(
                              camera,
                              world
                          );
                  }
                  else
                  {
                      Camera camera = FindCamera();

                      if (camera == null)
                          return false;

                      Vector3 screen =
                          camera.WorldToScreenPoint(
                              target.position
                          );

                      if (screen.z <= 0)
                          return false;

                      point = new Vector2(
                          screen.x,
                          screen.y
                      );
                  }

                  point.y = Screen.height - point.y;

                  return point.x >= 0 &&
                         point.x <= Screen.width &&
                         point.y >= 0 &&
                         point.y <= Screen.height;
              }

              private void OnGUI()
              {
                  if (SceneManager.GetActiveScene().name
                      != "CH1P1")
                      return;

                  if (markers.Count < 2)
                      return;

                  if (Event.current.type != EventType.Repaint)
                      return;

                  int oldDepth = GUI.depth;

                  Color oldColor = GUI.color;

                  GUI.depth = -1000;

                  if (labelStyle == null)
                  {
                      labelStyle =
                          new GUIStyle(GUI.skin.label);

                      labelStyle.alignment =
                          TextAnchor.MiddleCenter;

                      labelStyle.normal.textColor =
                          Color.white;

                      labelStyle.fontStyle =
                          FontStyle.Bold;

                      labelStyle.wordWrap = true;
                  }

                  if (font != null)
                      labelStyle.font = font;

                  labelStyle.fontSize = Mathf.Clamp(
                      Mathf.RoundToInt(
                          Screen.height * 0.038f
                      ),
                      16,
                      42
                  );

                  int language = Language();

                  foreach (var entry in markers)
                  {
                      Vector2 point;

                      if (!ScreenPosition(
                          entry.Value,
                          out point))
                          continue;

                      float width =
                          Screen.width * 0.23f;

                      float height =
                          Screen.height * 0.075f;

                      Rect safe = Screen.safeArea;

                      float safeTop =
                          Screen.height - safe.yMax;

                      float safeBottom =
                          Screen.height - safe.yMin;

                      float x = Mathf.Clamp(
                          point.x - width / 2,
                          safe.xMin,
                          safe.xMax - width
                      );

                      float y = Mathf.Clamp(
                          point.y - height,
                          safeTop,
                          safeBottom - height
                      );

                      Rect box = new Rect(
                          x, y, width, height
                      );

                      GUI.color = new Color(
                          0f, 0f, 0f, 0.75f
                      );

                      GUI.DrawTexture(
                          box,
                          Texture2D.whiteTexture
                      );

                      GUI.color = Color.white;

                      GUI.Label(
                          box,
                          names[language, entry.Key],
                          labelStyle
                      );
                  }

                  GUI.color = oldColor;

                  GUI.depth = oldDepth;
              }
          }
          CS

          cat > ExportedProject/Assets/AlphaLocationFix/link.xml <<'XML'
          <linker>
            <assembly fullname="Unity.TextMeshPro" preserve="all"/>
          </linker>
          XML

          echo "Custard location label fix added"

          echo "Original dialogue untouched"

          echo "Original location events untouched"

      - name: Set Fix 4 version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "ExportedProject/Assets/Editor/"
              "AlphaCI/BuildAlpha.cs"
          )

          text = file.read_text()

          text = text.replace(
              'PlayerSettings.bundleVersion = "0.1.0";',
              'PlayerSettings.bundleVersion = "0.1.4";'
          )

          text = text.replace(
              'PlayerSettings.iOS.buildNumber = "1";',
              'PlayerSettings.iOS.buildNumber = "4";'
          )

          file.write_text(text)

          print("Location Fix 4 prepared")

          PY

      - name: Export Unity IL2CPP to Xcode
        timeout-minutes: 70
        run: |
          set -euo pipefail

          bash -e "$RUNNER_TEMP/location-fix/export.sh"

          test -s Xcode/Unity-iPhone.xcodeproj/project.pbxproj

      - name: Return Unity License
        if: always() && steps.activate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          bash -e "$RUNNER_TEMP/location-fix/return.sh"

      - name: Build ARM64 application
        timeout-minutes: 45
        run: |
          set -euo pipefail

          bash -e "$RUNNER_TEMP/location-fix/xcode.sh"

      - name: Create Location Fix IPA
        run: |
          set -euo pipefail

          bash -e "$RUNNER_TEMP/location-fix/ipa.sh"

          test -s dist/Apocalypse-Alpha-CH1P1-Fix3.ipa

          mv dist/Apocalypse-Alpha-CH1P1-Fix3.ipa \
            dist/Apocalypse-Alpha-Location-Fix4.ipa

          unzip -tq \
            dist/Apocalypse-Alpha-Location-Fix4.ipa

          ls -lh dist/

          {
            echo "ALPHA LOCATION FIX 4"
            echo "IPA CREATED"
            echo "Original Chapter 1 Part 1"
            echo "Location selection overlay"
            echo "English Russian Ukrainian"
            echo "Original dialogue preserved"
            echo "ARM64 IL2CPP"
            echo "No new Recovery"
            echo "Device testing required"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Location Fix IPA
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Alpha-Location-Fix4
          path: dist/Apocalypse-Alpha-Location-Fix4.ipa
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Alpha-Location-Fix4-Logs
          path: logs/
          retention-days: 14
          if-no-files-found: warn
