name: Apocalypse DLC Reboot 1.03 - iPhone save fix

'on':
  workflow_dispatch:
    inputs:
      patch_url:
        description: Optional direct URL for the CI patch ZIP
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      UNITY_EDITOR_PATH: /Applications/Unity/Unity.app/Contents/MacOS/Unity
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PATCH_NAME: Apocalypse-Reboot-v1.03-Shader-Patch-CI.zip
    steps:
      - uses: actions/checkout@v5

      - name: Find and verify the mobile patch
        shell: bash
        env:
          PATCH_URL: ${{ inputs.patch_url }}
        run: |
          mkdir -p logs
          patch="$GITHUB_WORKSPACE/$PATCH_NAME"
          if [[ -n "$PATCH_URL" ]]; then
            patch="$RUNNER_TEMP/$PATCH_NAME"
            curl -fLsS --retry 3 --max-time 300 "$PATCH_URL" -o "$patch"
          elif [[ ! -f "$patch" ]]; then
            patch="$(find "$GITHUB_WORKSPACE" -type f -name "$PATCH_NAME" -print -quit)"
          fi
          if [[ ! -s "$patch" ]]; then
            echo "::error::Add $PATCH_NAME to this branch or supply its direct URL."
            exit 1
          fi
          unzip -tq "$patch"
          unzip -Z1 "$patch" > "$RUNNER_TEMP/apocalypse-patch-files.txt"
          for entry in ApocalypseCI/repair_export.py \
              Assets/Plugins/Assembly-CSharp.dll \
              Assets/Plugins/Unity.TextMeshPro.dll \
              Assets/ApocalypseLocale/ApocalypseLanguageMenu.cs \
              Assets/ApocalypseLocale/ApocalypseMobile.cs; do
            if ! grep -Fxq "$entry" "$RUNNER_TEMP/apocalypse-patch-files.txt"; then
              echo "::error::Patch is missing $entry. Upload the updated mobile ZIP."
              exit 1
            fi
          done
          printf 'APOCALYPSE_PATCH=%s\n' "$patch" >> "$GITHUB_ENV"

      - name: Download the Windows demo and recover the Unity project
        shell: bash
        timeout-minutes: 20
        run: |
          mkdir -p windows ripper
          api="https://gamejolt.com/site-api/web/discover/games/builds/get-download-url/1470786"
          source_url="$(curl -fsS --retry 3 --max-time 60 \
            -A 'Mozilla/5.0' -H 'Content-Type: application/json' \
            -H 'Referer: https://gamejolt.com/get/build?game=774657&build=1470786' \
            --data '{"forceDownload":true}' "$api" | jq -er '.payload.url')"
          curl -fLsS --retry 3 --max-time 600 \
            -A 'Mozilla/5.0' -e 'https://gamejolt.com/' "$source_url" -o source.rar
          printf '%s  %s\n' \
            049a0065ad012c9b5931f49cf3c5afa20016749236fbe4381a276930d8b14aac \
            source.rar | shasum -a 256 -c -
          if ! /usr/bin/tar -xf source.rar -C windows; then
            7z x -y -owindows source.rar >/dev/null
          fi
          game_data="$(find "$PWD/windows" -type d -name '*_Data' -print -quit)"
          test -s "$game_data/Managed/Assembly-CSharp.dll"

          release="https://github.com/AssetRipper/AssetRipper/releases/download/2.0.0"
          curl -fLsS --retry 3 --max-time 300 \
            "$release/AssetRipper_mac_arm64.tar.xz" -o ripper.tar.xz
          tar -xf ripper.tar.xz -C ripper
          ripper_bin="$(find "$PWD/ripper" -type f -name AssetRipper.GUI.Free -print -quit)"
          test -x "$ripper_bin"
          "$ripper_bin" --headless --port 18766 > logs/assetripper.log 2>&1 &
          ripper_pid=$!
          trap 'kill "$ripper_pid" 2>/dev/null || true' EXIT
          ripper_api=http://127.0.0.1:18766
          curl -fsS --retry 25 --retry-connrefused --retry-delay 1 \
            "$ripper_api/Settings/Edit" -o /dev/null
          curl -fsS --max-time 30 \
            -d 'ScriptExportMode=DllExportWithRenaming&ScriptContentLevel=Level2' \
            "$ripper_api/Settings/Update" -o /dev/null
          curl -fsS --max-time 180 --data-urlencode "Path=$(dirname "$game_data")" \
            "$ripper_api/LoadFolder" -o /dev/null
          curl -fsS --max-time 900 --data-urlencode "Path=$PWD/export" \
            "$ripper_api/Export/UnityProject" -o /dev/null
          test -s export/ExportedProject/Assets/Plugins/Assembly-CSharp.dll

      - name: Apply the mobile patch and repair the scenes
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE/export/ExportedProject"
          unzip -oq "$APOCALYPSE_PATCH" -d "$project"
          test -s "$project/Assets/ApocalypseLocale/ApocalypseMobile.cs"
          python3 "$project/ApocalypseCI/repair_export.py" "$project" \
            | tee logs/apocalypse-repair.txt

          editor="$project/Assets/Editor/ApocalypseCI"
          mkdir -p "$editor"
          printf '%s\n' '{"name":"ApocalypseCI","includePlatforms":["Editor"]}' \
            > "$editor/ApocalypseCI.asmdef"
          cat > "$editor/BuildApocalypse.cs" <<'CS'
          using System;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build;
          using UnityEditor.Build.Reporting;
          using UnityEngine;
          using UnityEngine.Rendering;

          public static class BuildApocalypse
          {
              public static void Run()
              {
                  var scenes = EditorBuildSettings.scenes
                      .Where(scene => scene.enabled)
                      .Select(scene => scene.path)
                      .ToArray();
                  if (scenes.Length != 11 ||
                      scenes[0] != "Assets/Scenes/DLC/Menus/COMPANYNAME.unity")
                      throw new BuildFailedException("Expected all 11 original scenes in order.");

                  PlayerSettings.productName = "Apocalypse DLC Reboot";
                  PlayerSettings.bundleVersion = "1.0.3";
                  PlayerSettings.SetApplicationIdentifier(
                      BuildTargetGroup.iOS, "com.apocalypsedlcreboot.ios");
                  PlayerSettings.iOS.targetOSVersionString = "15.0";
                  PlayerSettings.defaultInterfaceOrientation = UIOrientation.LandscapeLeft;
                  PlayerSettings.SetScriptingBackend(
                      BuildTargetGroup.iOS, ScriptingImplementation.IL2CPP);
                  PlayerSettings.SetManagedStrippingLevel(
                      BuildTargetGroup.iOS, ManagedStrippingLevel.Low);
                  PlayerSettings.stripEngineCode = false;
                  PlayerSettings.SetUseDefaultGraphicsAPIs(BuildTarget.iOS, false);
                  PlayerSettings.SetGraphicsAPIs(BuildTarget.iOS, new[] { GraphicsDeviceType.Metal });

                  string output = Environment.GetEnvironmentVariable("APOCALYPSE_XCODE_DIR");
                  var report = BuildPipeline.BuildPlayer(
                      scenes, output, BuildTarget.iOS, BuildOptions.None);
                  if (report.summary.result != BuildResult.Succeeded)
                      throw new BuildFailedException("iOS export failed: " + report.summary.result);
              }
          }
          CS

      - name: Enable the original save and load buttons
        shell: bash
        run: |
          python3 - "$GITHUB_WORKSPACE/export/ExportedProject" <<'PY'
          from pathlib import Path
          import re
          import sys

          assets = Path(sys.argv[1]) / "Assets" / "GameObject"
          pause = assets / "PauseUI.prefab"
          for name in ("SaveUI.prefab", "LoadUI.prefab"):
              if not (assets / name).is_file():
                  raise SystemExit(f"Missing original save or load menu: {name}")

          source = pause.read_text(encoding="utf-8")
          for name in ("btnSave", "btnLoad"):
              target = re.compile(
                  r"(?m)(^  m_Name: " + name
                  + r"\n(?:(?!^--- ).*\n)*?^  m_IsActive: )[01]$"
              )
              source, count = target.subn(r"\g<1>1", source)
              if count != 1:
                  raise SystemExit(f"Expected one pause-menu button: {name}")

          pause.write_text(source, encoding="utf-8")
          print("Apocalypse: enabled the original Save and Load buttons.")
          PY

      - name: Fix save restoration on iPhone
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE/export/ExportedProject"
          python3 - "$project" <<'PY'
          from pathlib import Path
          import re
          import sys

          assets = Path(sys.argv[1]) / "Assets"
          settings = assets / "MonoBehaviour" / (
              "Slendytubbies 3 The Apocalypse DLC Reboot_SettingsManager.asset"
          )
          source = settings.read_text(encoding="utf-8")
          source, count = re.subn(
              r"(?m)^  reloadSceneWhenLoading: [01]$",
              "  reloadSceneWhenLoading: 1",
              source,
          )
          if count != 1:
              raise SystemExit("Expected exactly one Adventure Creator reload setting.")
          settings.write_text(source, encoding="utf-8")
          PY

          cat > "$project/Assets/ApocalypseLocale/ApocalypseSaveFix.cs" <<'CS'
          using System;
          using System.Collections;
          using System.Collections.Generic;
          using System.IO;
          using AC;
          using UnityEngine;
          using SceneManager = UnityEngine.SceneManagement.SceneManager;

          public sealed class ApocalypseSaveFix : MonoBehaviour
          {
              private string logPath;
              private bool loading;

              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.BeforeSceneLoad)]
              private static void Install()
              {
                  if (Application.platform != RuntimePlatform.IPhonePlayer)
                      return;

                  iFileFormatHandler original = SaveSystem.FileFormatHandler;
                  SaveSystem.FileFormatHandler = new IosSaveFormat(original);

                  var root = new GameObject("Apocalypse save support");
                  DontDestroyOnLoad(root);
                  root.AddComponent<ApocalypseSaveFix>();
              }

              private void OnEnable()
              {
                  logPath = Path.Combine(Application.persistentDataPath, "apocalypse-save-load.txt");
                  EventManager.OnFinishSaving += FinishSave;
                  EventManager.OnBeforeLoading += BeginLoad;
                  EventManager.OnFinishLoading += FinishLoad;
                  EventManager.OnFailLoading += FailLoad;
                  Application.logMessageReceived += RecordUnityError;
              }

              private void OnDisable()
              {
                  EventManager.OnFinishSaving -= FinishSave;
                  EventManager.OnBeforeLoading -= BeginLoad;
                  EventManager.OnFinishLoading -= FinishLoad;
                  EventManager.OnFailLoading -= FailLoad;
                  Application.logMessageReceived -= RecordUnityError;
              }

              private void FinishSave(SaveFile file)
              {
                  Record("Saved slot " + file.saveID + " in " + SceneManager.GetActiveScene().name);
              }

              private void BeginLoad(SaveFile file)
              {
                  loading = true;
                  Record("Loading slot " + file.saveID + " from " + SceneManager.GetActiveScene().name);
              }

              private void FinishLoad()
              {
                  loading = false;
                  Record("Save restored in " + SceneManager.GetActiveScene().name);
                  StartCoroutine(CheckFade());
              }

              private void FailLoad(int slot)
              {
                  loading = false;
                  Record("Adventure Creator could not read slot " + slot);
              }

              private IEnumerator CheckFade()
              {
                  yield return new WaitForSecondsRealtime(0.5f);
                  var camera = KickStarter.mainCamera;
                  if (loading || camera == null || KickStarter.stateHandler == null)
                      yield break;

                  float alpha = camera.GetFadeAlpha();
                  Record("Camera fade after load: " + alpha);
                  if (alpha >= 0.99f && KickStarter.stateHandler.IsInGameplay())
                  {
                      camera.FadeIn(0f, false);
                      Record("Removed fully opaque camera fade after load.");
                  }
              }

              private void RecordUnityError(string message, string stack, LogType type)
              {
                  if (loading && (type == LogType.Error || type == LogType.Exception || type == LogType.Assert))
                      Record(message + Environment.NewLine + stack);
              }

              private void Record(string message)
              {
                  try
                  {
                      File.AppendAllText(logPath, DateTime.UtcNow.ToString("o") + " " + message + Environment.NewLine);
                  }
                  catch (IOException) { }
                  catch (UnauthorizedAccessException) { }
              }

              private sealed class IosSaveFormat : iFileFormatHandler
              {
                  private readonly iFileFormatHandler legacy;
                  private readonly FileFormatHandler_Json json = new FileFormatHandler_Json();

                  internal IosSaveFormat(iFileFormatHandler legacy)
                  {
                      this.legacy = legacy;
                  }

                  public string GetSaveMethod() => json.GetSaveMethod();
                  public string GetSaveExtension() => legacy.GetSaveExtension();
                  public string SerializeObject<T>(object data) => json.SerializeObject<T>(data);
                  public string SerializeAllRoomData(List<SingleLevelData> rooms) => json.SerializeAllRoomData(rooms);

                  public T DeserializeObject<T>(string data)
                  {
                      return IsJson(data) ? json.DeserializeObject<T>(StripMethod(data, json))
                                          : legacy.DeserializeObject<T>(StripMethod(data, legacy));
                  }

                  public List<SingleLevelData> DeserializeAllRoomData(string data)
                  {
                      if (string.IsNullOrEmpty(data))
                          return new List<SingleLevelData>();

                      return IsJson(data) ? json.DeserializeAllRoomData(StripMethod(data, json))
                                          : legacy.DeserializeAllRoomData(StripMethod(data, legacy));
                  }

                  public T LoadScriptData<T>(string data) where T : RememberData
                  {
                      if (string.IsNullOrEmpty(data))
                          return null;

                      return IsJson(data) ? json.LoadScriptData<T>(StripMethod(data, json))
                                          : legacy.LoadScriptData<T>(StripMethod(data, legacy));
                  }

                  private bool IsJson(string data)
                  {
                      return !string.IsNullOrEmpty(data) &&
                          (data[0] == '{' || data[0] == '[' || data.StartsWith(json.GetSaveMethod(), StringComparison.Ordinal));
                  }

                  private static string StripMethod(string data, iFileFormatHandler format)
                  {
                      string marker = format.GetSaveMethod();
                      return data != null && data.StartsWith(marker, StringComparison.Ordinal)
                          ? data.Substring(marker.Length) : data;
                  }
              }
          }
          CS

      - name: Fix the original startup scripts
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE/export/ExportedProject"
          python3 - "$project" <<'PY'
          from pathlib import Path
          import re
          import sys

          assets = Path(sys.argv[1]) / "Assets"
          plugins = assets / "Plugins"
          renames = {
              b"Assembly-CSharp": b"ApocalypseGames",
              b"Assembly-CSharp-firstpass": b"ApocalypseGames.Firstpass",
          }

          editor = re.compile(rb"(Editor: Editor\r?\n[ \t]+second:\r?\n[ \t]+enabled: )[01]")
          for old, new in renames.items():
              dll = plugins / (old.decode() + ".dll")
              meta = dll.with_suffix(".dll.meta")
              binary = dll.read_bytes()
              if binary.count(old + b"\0") != 1:
                  raise SystemExit(f"Unexpected assembly metadata: {dll}")
              for source, target in renames.items():
                  if len(source) != len(target):
                      raise SystemExit("Assembly names must have the same byte length")
                  binary = binary.replace(source + b"\0", target + b"\0")
                  binary = binary.replace(source + b".dll\0", target + b".dll\0")
              importer, count = editor.subn(rb"\g<1>1", meta.read_bytes())
              if count != 1:
                  raise SystemExit(f"Unexpected Editor importer settings: {meta}")
              target_dll = plugins / (new.decode() + ".dll")
              target_dll.write_bytes(binary)
              target_dll.with_suffix(".dll.meta").write_bytes(importer)
              dll.unlink()
              meta.unlink()

          type_name = re.compile(
              rb"(m_TargetAssemblyTypeName:[^\r\n]*?,[ \t]*)"
              rb"(Assembly-CSharp(?:-firstpass)?)(?=[ \t\r\n,'\"]|$)"
          )
          total = 0
          for path in assets.rglob("*"):
              if path.suffix not in {".unity", ".asset", ".prefab"}:
                  continue
              original = path.read_bytes()
              if not original.startswith((b"%YAML", b"\xef\xbb\xbf%YAML")):
                  continue
              updated, count = type_name.subn(
                  lambda match: match[1] + renames[match[2]], original
              )
              if count:
                  path.write_bytes(updated)
                  total += count
          print(f"Apocalypse: updated {total} UnityEvent assembly references.")

          check = assets / "Editor" / "ApocalypseCI" / "ApocalypseStartupCheck.cs"
          check.write_text("""using System.Collections.Generic;
          using UnityEditor;
          using UnityEditor.Build;
          using UnityEditor.Build.Reporting;
          using UnityEngine;
          using UnityEngine.SceneManagement;

          public sealed class ApocalypseStartupCheck : IProcessSceneWithReport
          {
              public int callbackOrder => 0;

              public void OnProcessScene(Scene scene, BuildReport report)
              {
                  if (report == null || report.summary.platform != BuildTarget.iOS ||
                      scene.name != "COMPANYNAME")
                      return;

                  var missing = new List<string>();
                  var types = new HashSet<string>();
                  foreach (var root in scene.GetRootGameObjects())
                  {
                      foreach (var item in root.GetComponentsInChildren<Transform>(true))
                      {
                          if (GameObjectUtility.GetMonoBehavioursWithMissingScriptCount(item.gameObject) > 0)
                              missing.Add(item.name);
                      }
                      foreach (var component in root.GetComponentsInChildren<MonoBehaviour>(true))
                      {
                          if (component != null)
                              types.Add(component.GetType().FullName);
                      }
                  }

                  foreach (var required in new[] {
                      "TranslateText", "AC.Sound", "SettingsManager2", "DiscordPresence.PresenceManager"
                  })
                  {
                      if (!types.Contains(required))
                          missing.Add(required);
                  }

                  if (missing.Count > 0)
                      throw new BuildFailedException(
                          "Apocalypse startup: missing " + string.Join(", ", missing));

                  Debug.Log("Apocalypse startup check passed: original scripts resolved.");
              }
          }
          """, encoding="utf-8")
          PY

      - name: Install Unity and iOS Build Support
        shell: bash
        timeout-minutes: 25
        run: |
          base=https://download.unity3d.com/download_unity/88f88f591b2e
          curl -fLsS --retry 3 --max-time 600 \
            "$base/MacEditorInstallerArm64/Unity-2021.3.45f2.pkg" \
            -o "$RUNNER_TEMP/apocalypse-unity.pkg"
          sudo installer -pkg "$RUNNER_TEMP/apocalypse-unity.pkg" -target /
          rm "$RUNNER_TEMP/apocalypse-unity.pkg"
          curl -fLsS --retry 3 --max-time 600 \
            "$base/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-2021.3.45f2.pkg" \
            -o "$RUNNER_TEMP/apocalypse-ios.pkg"
          sudo installer -pkg "$RUNNER_TEMP/apocalypse-ios.pkg" -target /
          rm "$RUNNER_TEMP/apocalypse-ios.pkg"
          test -x "$UNITY_EDITOR_PATH"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Activate Unity Personal
        id: activate
        shell: bash
        timeout-minutes: 10
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME || secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          npm install --global @rage-against-the-pixel/unity-cli@4.2.2
          unity-cli activate-license --license personal

      - name: Export the Xcode project
        shell: bash
        timeout-minutes: 70
        run: |
          export APOCALYPSE_XCODE_DIR="$GITHUB_WORKSPACE/Xcode"
          log="$GITHUB_WORKSPACE/logs/unity.log"
          touch "$log"
          tail -n +1 -F "$log" &
          log_pid=$!
          trap 'kill "$log_pid" 2>/dev/null || true' EXIT
          "$UNITY_EDITOR_PATH" -quit -batchmode -nographics -buildTarget iOS \
            -projectPath "$GITHUB_WORKSPACE/export/ExportedProject" \
            -executeMethod BuildApocalypse.Run -logFile "$log"
          grep -F 'Apocalypse startup check passed' "$log"
          test -s Xcode/Unity-iPhone.xcodeproj/project.pbxproj

      - name: Return Unity Personal license
        if: always() && steps.activate.outcome == 'success'
        shell: bash
        timeout-minutes: 5
        run: unity-cli return-license --license personal --when auto

      - name: Build the ARM64 IPA
        shell: bash
        timeout-minutes: 20
        run: |
          xcodebuild -project Xcode/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 build \
            | tee logs/xcode.log

          products="$PWD/DerivedData/Build/Products/Release-iphoneos"
          app="$(find "$products" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$app/Data"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          lipo "$app/$exe" -verify_arch arm64

          plist="$app/Info.plist"
          for key in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$plist" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :$key true" "$plist"
            else
              /usr/libexec/PlistBuddy -c "Add :$key bool true" "$plist"
            fi
          done

          stage="$(mktemp -d "$RUNNER_TEMP/apocalypse-ipa.XXXXXX")"
          mkdir -p dist "$stage/Payload"
          ditto "$app" "$stage/Payload/$(basename "$app")"
          output="$PWD/dist/Apocalypse-Reboot-1.03-SaveFix.ipa"
          ditto -c -k --norsrc --keepParent "$stage/Payload" "$output"
          unzip -tq "$output"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Reboot-1.03-SaveFix-IPA
          path: dist/Apocalypse-Reboot-1.03-SaveFix.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-build-logs
          path: logs/
          if-no-files-found: warn
