name: Apocalypse DLC Reboot 1.03 - iPhone

on:
  workflow_dispatch:
    inputs:
      patch_url:
        description: "Прямая HTTPS-ссылка на ZIP с тремя языками. Оставь пустым, если ZIP загружен в репозиторий."
        required: false
        type: string

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Find and verify the patch with three languages
        env:
          PATCH_URL: ${{ inputs.patch_url }}
        run: |
          mkdir -p logs
          export PATCH_FILE="$RUNNER_TEMP/apocalypse-patch.zip"
          if [[ -n "$PATCH_URL" ]]; then
            curl -fsSL --retry 2 --max-time 180 --max-filesize 20000000 \
              --proto '=https' --proto-redir '=https' --url "$PATCH_URL" -o "$PATCH_FILE"
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import subprocess
          from zipfile import BadZipFile, ZipFile

          required = {
              "Assets/Shader/TMPro.cginc",
              "Assets/ApocalypseLocale/ApocalypseLanguageMenu.cs",
              "Assets/Resources/4/DLC.txt",
              "Assets/Resources/5/DLC.txt",
          }
          target = Path(os.environ["PATCH_FILE"])

          if os.environ.get("PATCH_URL"):
              candidates = [target]
          else:
              tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
              candidates = sorted(
                  Path(os.fsdecode(name))
                  for name in tracked if name
                  and Path(os.fsdecode(name)).name.casefold().startswith("apocalypse-reboot-v1.03-shader-patch-ci")
                  and Path(os.fsdecode(name)).suffix.casefold() == ".zip"
              )

          for candidate in candidates:
              try:
                  with ZipFile(candidate) as archive:
                      if not required.issubset(archive.namelist()):
                          continue
                      for entry in archive.infolist():
                          path = PurePosixPath(entry.filename)
                          if (path.is_absolute() or ".." in path.parts or "\\" in entry.filename
                              or stat.S_ISLNK(entry.external_attr >> 16)):
                              raise BadZipFile("Unsafe archive entry")
                      if archive.testzip() is not None:
                          continue
              except (OSError, BadZipFile, RuntimeError):
                  continue
              if candidate != target:
                  shutil.copyfile(candidate, target)
              print("Verified Apocalypse 1.03 patch with all three languages.")
              break
          else:
              raise SystemExit(
                  "::error::Could not find the ZIP with three languages. "
                  "Commit the patch ZIP or enter its direct HTTPS link in patch_url."
              )
          PY

      - name: Download the Windows demo and recover the Unity project
        run: |
          mkdir -p windows ripper
          curl -fsSL --retry 3 --max-time 60 -H 'Content-Type: application/json' \
            --data '{"forceDownload":true}' \
            https://gamejolt.com/site-api/web/discover/games/builds/get-download-url/1470786 \
            | jq -er '.payload.url | select(startswith("https://"))' > "$RUNNER_TEMP/game-url"
          curl -fsSL --retry 3 --max-time 600 --proto '=https' --proto-redir '=https' \
            --url "$(cat "$RUNNER_TEMP/game-url")" -o game.rar
          echo '049a0065ad012c9b5931f49cf3c5afa20016749236fbe4381a276930d8b14aac  game.rar' | shasum -a 256 -c
          bsdtar -xf game.rar -C windows
          game_data="$(find "$PWD/windows" -type d -name '*_Data' -print -quit)"
          test -s "$game_data/Managed/Assembly-CSharp.dll"

          curl -fsSL --retry 3 --max-time 180 \
            https://github.com/AssetRipper/AssetRipper/releases/download/2.0.0/AssetRipper_mac_arm64.tar.xz \
            -o ripper.tar.xz
          tar -xf ripper.tar.xz -C ripper
          ripper_bin="$(find "$PWD/ripper" -type f -name AssetRipper.GUI.Free -print -quit)"
          test -x "$ripper_bin"
          api=http://127.0.0.1:18766
          "$ripper_bin" --headless --port 18766 > logs/assetripper.log 2>&1 &
          ripper_pid=$!
          trap 'kill "$ripper_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 "$api/Settings/Edit" -o /dev/null
          curl -fsS --max-time 30 \
            -d 'ScriptExportMode=DllExportWithRenaming&ScriptContentLevel=Level2' \
            "$api/Settings/Update" -o /dev/null
          curl -fsS --max-time 180 --data-urlencode "Path=$(dirname "$game_data")" \
            "$api/LoadFolder" -o /dev/null
          curl -fsS --max-time 900 --data-urlencode "Path=$PWD/export" \
            "$api/Export/UnityProject" -o /dev/null
          test -s export/ExportedProject/Assets/Plugins/Assembly-CSharp.dll

      - name: Apply the shaders and languages and prepare the iOS build
        run: |
          project="$PWD/export/ExportedProject"
          unzip -oq "$RUNNER_TEMP/apocalypse-patch.zip" -d "$project"
          test -s "$project/Assets/Shader/TMPro.cginc"
          test -d "$project/Assets/DLCShaderIncludes/PostFX2"
          if grep -rl --include='*.shader' 'DummyShaderTextExporter' "$project/Assets" > logs/shader-placeholders.txt; then
            cat logs/shader-placeholders.txt
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          plugins = Path("export/ExportedProject/Assets/Plugins")
          for meta in plugins.glob("*.dll.meta"):
              original = meta.read_text()
              updated = re.sub(r"(Editor: Editor\n    second:\n      enabled: )0", r"\g<1>1", original)
              if original != updated:
                  meta.write_text(updated)
          PY

          mkdir -p "$project/Assets/Editor/ApocalypseCI"
          cat > "$project/Assets/Editor/ApocalypseCI/ApocalypseCI.asmdef" <<'JSON'
          {"name":"ApocalypseCI","includePlatforms":["Editor"]}
          JSON
          cat > "$project/Assets/Editor/ApocalypseCI/BuildApocalypse.cs" <<'CS'
          using System;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;
          using UnityEngine.Rendering;

          public static class BuildApocalypse
          {
              public static void Run()
              {
                  var scenes = EditorBuildSettings.scenes.Where(s => s.enabled).Select(s => s.path).ToArray();
                  if (scenes.Length != 11 || !scenes.Any(s => s.EndsWith("/Chapter 2 Meltdown.unity")))
                      throw new Exception("Unexpected scene list for Apocalypse DLC Reboot 1.03");

                  PlayerSettings.productName = "Apocalypse DLC Reboot";
                  PlayerSettings.bundleVersion = "1.0.3";
                  PlayerSettings.SetApplicationIdentifier(BuildTargetGroup.iOS, "com.apocalypsedlcreboot.ios");
                  PlayerSettings.SetScriptingBackend(BuildTargetGroup.iOS, ScriptingImplementation.IL2CPP);
                  PlayerSettings.SetManagedStrippingLevel(BuildTargetGroup.iOS, ManagedStrippingLevel.Low);
                  PlayerSettings.defaultInterfaceOrientation = UIOrientation.LandscapeLeft;
                  PlayerSettings.iOS.targetOSVersionString = "15.0";
                  PlayerSettings.iOS.sdkVersion = iOSSdkVersion.DeviceSDK;
                  PlayerSettings.SetUseDefaultGraphicsAPIs(BuildTarget.iOS, false);
                  PlayerSettings.SetGraphicsAPIs(BuildTarget.iOS, new[] { GraphicsDeviceType.Metal });

                  var report = BuildPipeline.BuildPlayer(scenes, Environment.GetEnvironmentVariable("IOS_OUTPUT"),
                      BuildTarget.iOS, BuildOptions.None);
                  if (report.summary.result != BuildResult.Succeeded)
                      throw new Exception("Unity iOS export: " + report.summary.result);
              }
          }
          CS

      - name: Install Unity and iOS Build Support
        run: |
          base=https://download.unity3d.com/download_unity/88f88f591b2e
          for module in MacEditorInstallerArm64/Unity-2021.3.45f2.pkg \
                        MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-2021.3.45f2.pkg; do
            pkg="$RUNNER_TEMP/${module##*/}"
            curl -fsSL --retry 3 --max-time 1000 "$base/$module" -o "$pkg"
            sudo installer -pkg "$pkg" -target /
            rm "$pkg"
          done
          test -x /Applications/Unity/Unity.app/Contents/MacOS/Unity

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Activate Unity Personal
        id: license
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME || secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_USERNAME" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Add UNITY_USERNAME (or UNITY_EMAIL) and UNITY_PASSWORD in Actions secrets"
            exit 1
          fi
          npm install -g @rage-against-the-pixel/unity-cli@4.2.2
          unity-cli activate-license --license personal

      - name: Export the Xcode project
        timeout-minutes: 50
        run: |
          export IOS_OUTPUT="$PWD/Xcode"
          result=0
          /Applications/Unity/Unity.app/Contents/MacOS/Unity \
            -quit -batchmode -nographics -buildTarget iOS \
            -projectPath "$PWD/export/ExportedProject" -executeMethod BuildApocalypse.Run \
            -logFile "$PWD/logs/unity.log" || result=$?
          tail -n 80 logs/unity.log || true
          test "$result" -eq 0
          test -d Xcode/Unity-iPhone.xcodeproj

      - name: Return Unity Personal license
        if: always() && steps.license.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: unity-cli return-license --license personal --when auto

      - name: Build the ARM64 IPA
        run: |
          xcodebuild -version
          xcodebuild -project Xcode/Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 build 2>&1 | tee logs/xcode.log
          app="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          exe="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")"
          lipo -verify_arch arm64 "$app/$exe"
          mkdir -p Payload
          ditto "$app" Payload/ApocalypseReboot.app
          ditto -c -k --keepParent Payload Apocalypse-Reboot-1.03.ipa
          unzip -tq Apocalypse-Reboot-1.03.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Reboot-1.03-IPA
          path: Apocalypse-Reboot-1.03.ipa
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apocalypse-build-logs
          path: logs/
          if-no-files-found: ignore
