
name: Coming - Auto Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Prepare
        run: |
          mkdir -p game reports
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python3 -m pip install requests beautifulsoup4

      - name: Download Coming Beta
        run: |
          python3 - <<'PY'
          import requests
          import zipfile
          from bs4 import BeautifulSoup

          url = "https://www.mediafire.com/file/dym00pxjpkcc1oz/Coming.zip/file"

          session = requests.Session()
          session.headers["User-Agent"] = "Mozilla/5.0"

          page = session.get(url, timeout=60)
          page.raise_for_status()

          soup = BeautifulSoup(page.text, "html.parser")
          button = soup.select_one("#downloadButton")

          if not button or not button.get("href"):
              raise RuntimeError("Download link not found")

          download = button["href"]

          with session.get(download, stream=True, timeout=120) as response:
              response.raise_for_status()
              with open("Coming.zip", "wb") as file:
                  for chunk in response.iter_content(1024 * 1024):
                      file.write(chunk)

          if not zipfile.is_zipfile("Coming.zip"):
              raise RuntimeError("Downloaded file is not a ZIP archive")

          print("Archive downloaded successfully")
          PY

      - name: Extract original game
        run: |
          7z t Coming.zip
          7z x Coming.zip -ogame -y

      - name: Detect Unity game
        run: |
          find game -type f > reports/files.txt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("game")
          managers = list(root.rglob("globalgamemanagers"))
          dlls = list(root.rglob("Assembly-CSharp.dll"))
          il2cpp = list(root.rglob("GameAssembly.dll"))

          lines = [
              "They're Coming Recovery",
              f"Unity managers: {len(managers)}",
              f"Mono assemblies: {len(dlls)}",
              f"IL2CPP libraries: {len(il2cpp)}"
          ]

          for file in managers:
              data = file.read_bytes()[:65536]
              versions = re.findall(
                  rb'\d{1,4}\.\d+\.\d+[abfp]\d+', data
              )
              lines.append(f"Unity file: {file}")
              for version in sorted(set(versions)):
                  lines.append(
                      "Possible Unity version: " +
                      version.decode()
                  )

          for file in dlls:
              lines.append(f"Gameplay DLL: {file}")

          Path("reports/summary.txt").write_text(
              "\n".join(lines), encoding="utf-8"
          )

          print("\n".join(lines))

          if not managers:
              raise RuntimeError("Unity game not detected")
          PY

      - name: Show recovery report
        if: always()
        run: |
          if [ -f reports/summary.txt ]; then
            cat reports/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coming-Recovery-Report
          path: reports/
