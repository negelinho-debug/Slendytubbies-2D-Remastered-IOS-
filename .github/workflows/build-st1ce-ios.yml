name: Build ST1 Community Edition iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: st1ce-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 160
    env:
      UNITY_VERSION: '2021.3.41f1'
      UNITY_REVISION: '6c5a9e20c022'
    defaults:
      run:
        shell: bash
    steps:
      - name: Set build paths
        run: |
          set -euo pipefail
          printf 'ST1CE_PROJECT=%s\n' "$RUNNER_TEMP/st1ce-source/Slendytubbies 1 Community Edition Updated" >> "$GITHUB_ENV"
          printf 'ST1CE_XCODE=%s\n' "$RUNNER_TEMP/st1ce-xcode" >> "$GITHUB_ENV"

      - name: Download and extract the original Unity project
        run: |
          set -euo pipefail
          mkdir -p logs
          page='https://gamejolt.com/games/St1cer/972452'
          resolver='https://gamejolt.com/site-api/web/discover/games/builds/get-download-url/1829390'
          archive="$RUNNER_TEMP/st1ce-source.rar"
          curl --fail --silent --show-error --retry 4 --connect-timeout 25 \
            -A 'Mozilla/5.0' -e "$page" -H 'Content-Type: application/json' \
            -d '{"forceDownload":true}' "$resolver" -o "$RUNNER_TEMP/st1ce-download.json"
          url="$(python3 - "$RUNNER_TEMP/st1ce-download.json" <<'PY'
          import json
          import sys
          from urllib.parse import urlsplit
          with open(sys.argv[1], encoding="utf-8") as source:
              url = json.load(source)["payload"]["url"]
          if urlsplit(url).scheme != "https":
              raise SystemExit("Expected a secure Game Jolt download URL")
          print(url)
          PY
          )"
          curl --fail --location --silent --show-error --retry 4 --connect-timeout 25 \
            --proto '=https' --proto-redir '=https' "$url" -o "$archive"
          test "$(stat -f %z "$archive")" = 2520987739

          tools_dir="$RUNNER_TEMP/st1ce-unrar"
          extract_to="$RUNNER_TEMP/st1ce-source"
          mkdir -p "$tools_dir" "$extract_to"
          curl -fLSs --retry 3 --connect-timeout 25 \
            https://www.rarlab.com/rar/rarmacos-x64-723.tar.gz -o "$tools_dir/unrar.tar.gz"
          printf '%s  %s\n' \
            da1fb3c3d7748136c9b369b683d574b372cb1ed049a634a81f85d93918346d8f \
            "$tools_dir/unrar.tar.gz" | shasum -a 256 -c -
          tar -xzf "$tools_dir/unrar.tar.gz" -C "$tools_dir" rar/unrar
          test -x "$tools_dir/rar/unrar"

          folder='Slendytubbies 1 Community Edition Updated'
          "$tools_dir/rar/unrar" x -o+ -p- -idq "$archive" \
            "$folder/Assets/*" "$folder/Packages/*" "$folder/ProjectSettings/*" "$extract_to/" \
            > logs/extraction.log 2>&1 || {
              tail -n 80 logs/extraction.log
              exit 1
            }
          test -s "$ST1CE_PROJECT/ProjectSettings/ProjectVersion.txt"
          test -s "$ST1CE_PROJECT/Packages/manifest.json"
          test -s "$ST1CE_PROJECT/Assets/NewScenes/mainmeny.unity"
          rm "$archive" "$RUNNER_TEMP/st1ce-download.json"

      - name: Verify the source project and prepare the iOS export
        run: |
          set -euo pipefail
          python3 - "$ST1CE_PROJECT" "$UNITY_VERSION" <<'PY' | tee logs/project.log
          import json
          import re
          import sys
          from pathlib import Path

          project = Path(sys.argv[1])
          version_file = project / "ProjectSettings/ProjectVersion.txt"
          version = version_file.read_text(encoding="utf-8")
          if f"m_EditorVersion: {sys.argv[2]}" not in version.splitlines():
              raise SystemExit(f"Unexpected project version:\n{version}")
          print(version, end="")

          settings = (project / "ProjectSettings/EditorBuildSettings.asset").read_text(encoding="utf-8")
          scenes = re.findall(r"(?m)^\s*- enabled: 1\n\s+path: (Assets/[^\r\n]+)", settings)
          if not scenes or scenes[0] != "Assets/NewScenes/mainmeny.unity":
              raise SystemExit("The original main menu is missing from the build settings")
          for scene in scenes:
              if not (project / scene).is_file():
                  raise SystemExit(f"Missing enabled scene: {scene}")
              print(scene)

          manifest_path = project / "Packages/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          toolchain = "com.unity.toolchain.win-x86_64-linux-x86_64"
          if manifest["dependencies"].pop(toolchain, None):
              manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
              print(f"Removed the Windows-hosted Linux toolchain from the staged iOS project: {toolchain}")

          print("\nMobile input and native plugin candidates")
          for asset in sorted((project / "Assets").rglob("*")):
              if asset.suffix.lower() in {".cs", ".prefab", ".a", ".so", ".aar", ".bundle", ".framework"}:
                  label = str(asset.relative_to(project))
                  if re.search(r"mobile|android|ios|joystick|touch|controller|/plugins/", label, re.I):
                      print(label)
          PY

          mkdir -p "$ST1CE_PROJECT/Assets/Editor"
          cat > "$ST1CE_PROJECT/Assets/Editor/ST1CEIOSExport.cs" <<'CS'
          using System;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build;
          using UnityEditor.Build.Reporting;

          public static class ST1CEIOSExport
          {
              public static void Run()
              {
                  var scenes = EditorBuildSettings.scenes.Where(scene => scene.enabled)
                      .Select(scene => scene.path).ToArray();
                  if (scenes.Length == 0 || scenes[0] != "Assets/NewScenes/mainmeny.unity")
                      throw new InvalidOperationException("The original main menu must be the first scene.");

                  PlayerSettings.SetApplicationIdentifier(NamedBuildTarget.iOS, "com.fanport.st1ceremaster");
                  PlayerSettings.SetScriptingBackend(NamedBuildTarget.iOS, ScriptingImplementation.IL2CPP);
                  PlayerSettings.iOS.sdkVersion = iOSSdkVersion.DeviceSDK;
                  PlayerSettings.iOS.targetOSVersionString = "15.0";

                  string output = Environment.GetEnvironmentVariable("ST1CE_XCODE");
                  if (string.IsNullOrWhiteSpace(output))
                      throw new InvalidOperationException("ST1CE_XCODE is missing.");

                  UnityEngine.Debug.Log("[ST1CE] Starting iOS build for " + scenes.Length + " enabled scenes.");
                  var result = BuildPipeline.BuildPlayer(new BuildPlayerOptions
                  {
                      scenes = scenes,
                      locationPathName = output,
                      target = BuildTarget.iOS,
                      options = BuildOptions.None
                  });

                  if (result.summary.result != BuildResult.Succeeded)
                      throw new InvalidOperationException("Unity export failed: " + result.summary.result);
                  UnityEngine.Debug.Log("[ST1CE] Xcode project exported successfully.");
              }
          }
          CS

      - name: Prepare iPhone controls and menu translations
        run: |
          set -euo pipefail
          noto=https://raw.githubusercontent.com/notofonts/noto-fonts/main
          font="$ST1CE_PROJECT/Assets/ST1CEPortNoto.ttf"
          curl -fLSs --retry 3 --connect-timeout 25 "$noto/hinted/ttf/NotoSans/NotoSans-Regular.ttf" -o "$font"
          test "$(git hash-object "$font")" = d55220958aa51eeeb85048d746eabe43d2cd9f14
          curl -fLSs --retry 3 --connect-timeout 25 "$noto/LICENSE" -o logs/Noto-OFL.txt

          cat > "$ST1CE_PROJECT/Assets/LanguageManager.cs" <<'CS'
          using System.Collections.Generic;
          using UnityEngine;
          using UnityEngine.UI;

          public class LanguageManager : MonoBehaviour
          {
              public enum Idioma { Portugues, Ingles, Espanhol, Japones, Chines, Russo, Ucraniano }
              public Idioma idiomaAtual = Idioma.Portugues;

              [System.Serializable]
              public class TextoIdioma
              {
                  public Text textoUI;

                  [TextArea] public string textoPortugues;
                  [TextArea] public string textoIngles;
                  [TextArea] public string textoEspanhol;
                  [TextArea] public string textoJapones;
                  [TextArea] public string textoChines;
                  [TextArea] public string textoRusso;
                  [TextArea] public string textoUcraniano;

                  public string GetText(Idioma idioma)
                  {
                      switch (idioma)
                      {
                          case Idioma.Portugues: return textoPortugues;
                          case Idioma.Espanhol: return textoEspanhol;
                          case Idioma.Japones: return textoJapones;
                          case Idioma.Chines: return textoChines;
                          case Idioma.Russo: return string.IsNullOrEmpty(textoRusso) ? textoIngles : textoRusso;
                          case Idioma.Ucraniano: return string.IsNullOrEmpty(textoUcraniano) ? textoIngles : textoUcraniano;
                          default: return textoIngles;
                      }
                  }
              }

              public TextoIdioma[] textos;
              public Button botaoPortugues;
              public Button botaoIngles;
              public Button botaoEspanhol;
              public Button botaoJapones;
              public Button botaoChines;
              public Button botaoRusso;
              public Button botaoUcraniano;
              public Font portFont;

              private const string Preference = "st1ce.language";
              private readonly Dictionary<Text, Font> originalFonts = new Dictionary<Text, Font>();

              public static Idioma SavedLanguage(Idioma fallback = Idioma.Ingles)
              {
                  return (Idioma)Mathf.Clamp(PlayerPrefs.GetInt(Preference, (int)fallback), 0, (int)Idioma.Ucraniano);
              }

              void Start()
              {
                  foreach (var item in textos)
                      if (item.textoUI != null)
                          originalFonts[item.textoUI] = item.textoUI.font;

                  Bind(botaoPortugues, Idioma.Portugues);
                  Bind(botaoIngles, Idioma.Ingles);
                  Bind(botaoEspanhol, Idioma.Espanhol);
                  Bind(botaoJapones, Idioma.Japones);
                  Bind(botaoChines, Idioma.Chines);
                  Bind(botaoRusso, Idioma.Russo);
                  Bind(botaoUcraniano, Idioma.Ucraniano);
                  idiomaAtual = SavedLanguage(idiomaAtual);
                  AtualizarTextos();
              }

              private void Bind(Button button, Idioma idioma)
              {
                  if (button != null)
                      button.onClick.AddListener(() => TrocarIdioma(idioma));
              }

              public void TrocarIdioma(Idioma novoIdioma)
              {
                  idiomaAtual = novoIdioma;
                  PlayerPrefs.SetInt(Preference, (int)novoIdioma);
                  PlayerPrefs.Save();
                  AtualizarTextos();
              }

              void AtualizarTextos()
              {
                  bool cyrillic = idiomaAtual == Idioma.Russo || idiomaAtual == Idioma.Ucraniano;
                  foreach (var item in textos)
                  {
                      Text label = item.textoUI;
                      if (label == null)
                          continue;
                      if (cyrillic && portFont != null)
                          label.font = portFont;
                      else if (originalFonts.TryGetValue(label, out Font original))
                          label.font = original;
                      label.text = item.GetText(idiomaAtual);
                  }
              }
          }
          CS

          cat > "$ST1CE_PROJECT/Assets/ST1CEPortLabel.cs" <<'CS'
          using UnityEngine;
          using UnityEngine.UI;

          public sealed class ST1CEPortLabel : MonoBehaviour
          {
              public Text label;
              public Font cyrillicFont;
              public string russian;
              public string ukrainian;

              private void Start()
              {
                  var language = LanguageManager.SavedLanguage();
                  if (language != LanguageManager.Idioma.Russo && language != LanguageManager.Idioma.Ucraniano)
                      return;

                  label.font = cyrillicFont;
                  label.resizeTextForBestFit = true;
                  label.resizeTextMinSize = Mathf.Min(10, label.fontSize);
                  label.resizeTextMaxSize = Mathf.Max(label.fontSize, label.resizeTextMinSize);
                  label.text = language == LanguageManager.Idioma.Russo ? russian : ukrainian;
              }
          }
          CS

          cat > "$ST1CE_PROJECT/Assets/ST1CEPortInput.cs" <<'CS'
          #if UNITY_IOS
          using UnityEngine;

          internal static class ST1CEPortInput
          {
              internal static Joystick FindStick(Transform handle)
              {
                  return handle == null ? null : handle.GetComponentInParent<Joystick>();
              }

              internal static Vector2 Read(Joystick stick)
              {
                  return stick == null ? Vector2.zero : Vector2.ClampMagnitude(stick.Direction, 1f);
              }

              internal static Vector3 GroundDirection(Transform player, Joystick stick)
              {
                  Vector2 input = Read(stick);
                  return player.right * input.x + player.forward * input.y;
              }

              internal static void Move(CharacterController controller, Vector3 horizontalVelocity,
                  float gravity, float jumpHeight, ref Vector3 velocity, ref bool jump)
              {
                  if (controller.isGrounded)
                      velocity.y = jump ? Mathf.Sqrt(2f * jumpHeight * gravity) : -1f;
                  else
                      velocity.y -= gravity * Time.deltaTime;

                  jump = false;
                  controller.Move((horizontalVelocity + Vector3.up * velocity.y) * Time.deltaTime);
              }

              internal static void Look(Transform player, Camera camera, Joystick stick, ref float pitch)
              {
                  if (camera == null || stick == null)
                      return;

                  Vector2 input = Read(stick);
                  float sensitivity = Mathf.Clamp(PlayerPrefs.GetFloat("CameraSensitivity", 2f), 0.25f, 8f);
                  float step = Time.deltaTime * 65f * sensitivity;
                  player.Rotate(0f, input.x * step, 0f);
                  pitch = Mathf.Clamp(pitch - input.y * step, -85f, 85f);
                  camera.transform.localRotation = Quaternion.Euler(pitch, 0f, 0f);
              }
          }
          #endif
          CS

          cat > "$ST1CE_PROJECT/Assets/ST1CECrouch.cs" <<'CS'
          using UnityEngine;

          public sealed class ST1CECrouch : MonoBehaviour
          {
              internal bool Held { get; set; }

              private CharacterController controller;
              private Transform view;
              private float standingHeight;
              private Vector3 standingCenter;
              private Vector3 standingView;
              private bool crouching;

              internal void Initialize(CharacterController motor, Camera camera)
              {
                  controller = motor;
                  standingHeight = motor.height;
                  standingCenter = motor.center;
                  view = camera == null ? null : camera.transform;
                  if (view != null)
                      standingView = view.localPosition;
              }

              internal bool Step()
              {
                  if (controller == null || Held == crouching)
                      return crouching;

                  if (!Held && !HasStandingClearance())
                      return true;

                  float height = Held ? Mathf.Min(standingHeight,
                      Mathf.Max(controller.radius * 2f, standingHeight * 0.58f)) : standingHeight;
                  float drop = (standingHeight - height) * 0.5f;
                  controller.height = height;
                  controller.center = standingCenter - Vector3.up * drop;

                  if (view != null)
                  {
                      Vector3 offset = transform.TransformVector(Vector3.down * drop);
                      if (view.parent != null)
                          offset = view.parent.InverseTransformVector(offset);
                      view.localPosition = standingView + offset;
                  }

                  crouching = Held;
                  return crouching;
              }

              private bool HasStandingClearance()
              {
                  Vector3 scale = transform.lossyScale;
                  float radius = controller.radius * Mathf.Max(Mathf.Abs(scale.x), Mathf.Abs(scale.z));
                  float skin = controller.skinWidth * Mathf.Abs(scale.y);
                  radius = Mathf.Max(0.01f, radius - skin);

                  Vector3 crouchedTop = transform.TransformPoint(
                      controller.center + Vector3.up * (controller.height * 0.5f)) - transform.up * radius;
                  Vector3 standingTop = transform.TransformPoint(
                      standingCenter + Vector3.up * (standingHeight * 0.5f)) - transform.up * radius;

                  foreach (var hit in Physics.OverlapCapsule(crouchedTop, standingTop, radius,
                      Physics.AllLayers, QueryTriggerInteraction.Ignore))
                  {
                      if (hit != controller && !hit.transform.IsChildOf(transform)
                          && !Physics.GetIgnoreLayerCollision(gameObject.layer, hit.gameObject.layer)
                          && !Physics.GetIgnoreCollision(controller, hit))
                          return false;
                  }
                  return true;
              }

              private void OnDisable()
              {
                  Held = false;
              }
          }
          CS

          cat > "$ST1CE_PROJECT/Assets/ST1CECrouchButton.cs" <<'CS'
          using UnityEngine;
          using UnityEngine.EventSystems;
          using UnityEngine.UI;

          public sealed class ST1CECrouchButton : MonoBehaviour, IPointerDownHandler, IPointerUpHandler
          {
              public ST1CECrouch[] players = System.Array.Empty<ST1CECrouch>();
              public Image background;
              private int? activePointer;

              public void OnPointerDown(PointerEventData eventData)
              {
                  if (activePointer.HasValue || eventData.button != PointerEventData.InputButton.Left)
                      return;

                  activePointer = eventData.pointerId;
                  SetHeld(true);
                  background.color = new Color(0.25f, 0.25f, 0.25f, 0.9f);
              }

              public void OnPointerUp(PointerEventData eventData)
              {
                  if (activePointer == eventData.pointerId)
                      Release();
              }

              private void OnDisable()
              {
                  Release();
              }

              private void OnApplicationFocus(bool hasFocus)
              {
                  if (!hasFocus)
                      Release();
              }

              private void Release()
              {
                  activePointer = null;
                  SetHeld(false);
                  if (background != null)
                      background.color = new Color(0f, 0f, 0f, 0.7f);
              }

              private void SetHeld(bool held)
              {
                  foreach (var player in players)
                      if (player != null && (!held || player.isActiveAndEnabled))
                          player.Held = held;
              }
          }
          CS

          cat > "$ST1CE_PROJECT/Assets/Editor/ST1CEPortScenes.cs" <<'CS'
          using System.Collections.Generic;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build;
          using UnityEditor.Build.Reporting;
          using UnityEngine;
          using UnityEngine.SceneManagement;
          using UnityEngine.UI;

          public sealed class ST1CEPortScenes : IProcessSceneWithReport
          {
              public int callbackOrder => 0;

              private const string FontPath = "Assets/ST1CEPortNoto.ttf";
              private const string MenuPath = "Assets/NewScenes/mainmeny.unity";
              private const string EnglishHelp = "Left joystick: move.\nRight joystick: look.\nUse Jump, Run and Flashlight. Hold Crouch to crouch.\nEsc: return to the main menu.\nIn Sandbox, use the Sandbox button for sandbox options.";

              private static readonly Dictionary<string, (string russian, string ukrainian)> Translations =
                  new Dictionary<string, (string, string)>
                  {
                      { "SinglePlayer", ("Одиночная игра", "Одиночна гра") },
                      { "Credits", ("Авторы", "Автори") },
                      { "Settings", ("Настройки", "Налаштування") },
                      { "Multiplayer", ("Сетевая игра", "Мережева гра") },
                      { "Controls", ("Управление", "Керування") },
                      { "Language (Menu)", ("Язык меню", "Мова меню") },
                      { "Volume:", ("Громкость:", "Гучність:") },
                      { "Screen:", ("Экран:", "Екран:") },
                      { "graphics:", ("Графика:", "Графіка:") },
                      { "Disable Shadows:", ("Отключить тени:", "Вимкнути тіні:") },
                      { "Back", ("Назад", "Назад") },
                      { "Field of View:", ("Поле зрения:", "Поле зору:") },
                      { "RoomName:", ("Название комнаты:", "Назва кімнати:") },
                      { "Skins:", ("Облики:", "Образи:") },
                      { "Jump", ("Прыжок", "Стрибок") },
                      { "Run", ("Бег", "Біг") },
                      { "Crouch", ("Присесть", "Присісти") },
                      { "Flashlight", ("Фонарь", "Ліхтар") },
                      { "Esc", ("В меню", "У меню") },
                      { "Chat", ("Чат", "Чат") },
                      { "Name", ("Имя", "Ім’я") },
                      { "Send", ("Отправить", "Надіслати") },
                      { "Enter text...", ("Введи текст…", "Введи текст…") },
                      { "Create as a Player", ("Создать за игрока", "Створити за гравця") },
                      { "Create as a Enemy", ("Создать за монстра", "Створити за монстра") },
                      { "Connect as a Player", ("Войти за игрока", "Увійти за гравця") },
                      { "Connect as a Enemy", ("Войти за монстра", "Увійти за монстра") },
                      { "Sandbox", ("Песочница", "Пісочниця") },
                      { "Close", ("Закрыть", "Закрити") },
                      { "Maps", ("Карты", "Мапи") },
                      { "Enemies", ("Монстры", "Монстри") },
                      { "Light/Effects", ("Свет и эффекты", "Світло й ефекти") },
                  };

              public void OnProcessScene(Scene scene, BuildReport report)
              {
                  if (report == null || report.summary.platform != BuildTarget.iOS)
                      return;

                  var roots = scene.GetRootGameObjects();
                  Font font = AssetDatabase.LoadAssetAtPath<Font>(FontPath);
                  if (font == null)
                      throw new BuildFailedException("ST1CE Cyrillic font did not import: " + FontPath);

                  if (scene.path == MenuPath)
                  {
                      var manager = roots.SelectMany(root => root.GetComponentsInChildren<LanguageManager>(true)).Single();
                      AddLanguages(manager, font);
                      return;
                  }

                  var rooms = roots.SelectMany(root => root.GetComponentsInChildren<Room>(true)).ToArray();
                  var mobile = rooms.FirstOrDefault(room => room.gameObject.name == "NetworkManagerMobile");
                  var desktop = rooms.FirstOrDefault(room => room.gameObject.name == "NetworkManager");
                  if (mobile == null)
                  {
                      if (desktop != null && scene.path.StartsWith("Assets/NewScenes/"))
                          throw new BuildFailedException("Original mobile setup is missing in " + scene.path);
                      return;
                  }
                  if (desktop == null || mobile.objectsToDisable == null || desktop.objectsToDisable == null)
                      throw new BuildFailedException("Incomplete mobile and desktop setup in " + scene.path);

                  var mobileObjects = mobile.objectsToDisable.Where(item => item != null).ToArray();
                  var mobilePlayer = mobileObjects.FirstOrDefault(item => item.name == "Player Mobile");
                  if (mobilePlayer == null || !mobileObjects.Any(item => item.GetComponent<Canvas>() != null))
                      throw new BuildFailedException("Original Player Mobile or joystick canvas is missing in " + scene.path);

                  foreach (var item in desktop.objectsToDisable)
                      if (item != null && !mobileObjects.Contains(item))
                          item.SetActive(false);

                  desktop.gameObject.SetActive(false);
                  mobile.gameObject.SetActive(true);
                  foreach (var item in mobileObjects)
                      item.SetActive(true);

                  foreach (var obj in mobileObjects.Where(item => item.GetComponent<Canvas>() != null).Append(mobile.gameObject))
                  {
                      foreach (Text label in obj.GetComponentsInChildren<Text>(true))
                      {
                          if (!Translations.TryGetValue(label.text.Trim(), out var translations))
                              continue;
                          var localized = label.gameObject.AddComponent<ST1CEPortLabel>();
                          localized.label = label;
                          localized.cyrillicFont = font;
                          localized.russian = translations.russian;
                          localized.ukrainian = translations.ukrainian;
                      }
                  }
                  AddCrouch(roots, mobileObjects, font, scene.path);
                  Debug.Log("[ST1CE] Enabled the original mobile player, UI and room setup in " + scene.name);
              }

              private static void AddCrouch(GameObject[] roots, GameObject[] mobileObjects, Font font, string scenePath)
              {
                  var players = roots
                      .SelectMany(root => root.GetComponentsInChildren<CharacterController>(true))
                      .Where(controller => controller.GetComponent<PlayerControllerMobile>() != null
                          || controller.GetComponent<EnemyControllerMobile>() != null
                          || controller.GetComponent<PlayerSandboxMobile>() != null)
                      .Select(controller => controller.gameObject.AddComponent<ST1CECrouch>())
                      .ToArray();
                  var canvases = mobileObjects.Where(obj => obj.GetComponent<Canvas>() != null).ToArray();
                  var canvas = canvases.FirstOrDefault(obj => obj.GetComponentInChildren<Joystick>(true) != null);
                  if (players.Length == 0 || canvas == null)
                      throw new BuildFailedException("Crouch requires the original mobile player and joystick canvas in " + scenePath);

                  var button = new GameObject("Crouch (iOS)", typeof(RectTransform), typeof(Image));
                  button.transform.SetParent(canvas.transform, false);
                  var rect = (RectTransform)button.transform;
                  rect.anchorMin = rect.anchorMax = new Vector2(0.5f, 0.10f);
                  rect.pivot = new Vector2(0.5f, 0.5f);
                  rect.sizeDelta = new Vector2(112f, 52f);
                  rect.anchoredPosition = Vector2.zero;

                  var image = button.GetComponent<Image>();
                  image.color = new Color(0f, 0f, 0f, 0.7f);
                  var press = button.AddComponent<ST1CECrouchButton>();
                  press.players = players;
                  press.background = image;

                  var title = new GameObject("Label", typeof(RectTransform), typeof(Text));
                  title.transform.SetParent(button.transform, false);
                  var titleRect = (RectTransform)title.transform;
                  titleRect.anchorMin = Vector2.zero;
                  titleRect.anchorMax = Vector2.one;
                  titleRect.offsetMin = new Vector2(5f, 3f);
                  titleRect.offsetMax = new Vector2(-5f, -3f);
                  var label = title.GetComponent<Text>();
                  label.text = "Crouch";
                  label.font = font;
                  label.fontSize = 19;
                  label.alignment = TextAnchor.MiddleCenter;
                  label.color = Color.white;
                  label.raycastTarget = false;
                  var translation = Translations[label.text];
                  var localized = title.AddComponent<ST1CEPortLabel>();
                  localized.label = label;
                  localized.cyrillicFont = font;
                  localized.russian = translation.russian;
                  localized.ukrainian = translation.ukrainian;
              }

              private static void AddLanguages(LanguageManager manager, Font font)
              {
                  manager.portFont = font;
                  manager.botaoRusso = MakeLanguageButton(manager, font, "Русский", 28f);
                  manager.botaoUcraniano = MakeLanguageButton(manager, font, "Українська", 56f);
                  foreach (var row in manager.textos)
                  {
                      string key = row.textoIngles.Trim();
                      if (key.StartsWith("Walk:"))
                      {
                          row.textoIngles = EnglishHelp;
                          row.textoRusso = "Левый джойстик: движение.\nПравый джойстик: обзор.\nКнопки: прыжок, бег и фонарь. Удерживай «Присесть».\n«В меню»: вернуться в главное меню.\nКнопка «Песочница» открывает её настройки.";
                          row.textoUcraniano = "Лівий джойстик: рух.\nПравий джойстик: огляд.\nКнопки: стрибок, біг і ліхтар. Утримуй «Присісти».\n«У меню»: повернутися до головного меню.\nКнопка «Пісочниця» відкриває її налаштування.";
                      }
                      else if (key.StartsWith("Original Game:"))
                      {
                          row.textoRusso = row.textoIngles.Replace("Original Game:", "Оригинальная игра:")
                              .Replace("Fan game:", "Фанатская игра:").Replace("Special Thanks:", "Благодарности:")
                              .Replace("Beta test:", "Бета-тест:").Replace("New Ester Egg:", "Новая пасхалка:");
                          row.textoUcraniano = row.textoIngles.Replace("Original Game:", "Оригінальна гра:")
                              .Replace("Fan game:", "Фанатська гра:").Replace("Special Thanks:", "Подяки:")
                              .Replace("Beta test:", "Бета-тест:").Replace("New Ester Egg:", "Нова великодка:");
                      }
                      else if (Translations.TryGetValue(key, out var translations))
                      {
                          row.textoRusso = translations.russian;
                          row.textoUcraniano = translations.ukrainian;
                      }
                  }
                  Debug.Log("[ST1CE] Added Russian and Ukrainian to the original language menu.");
              }

              private static Button MakeLanguageButton(LanguageManager manager, Font font, string caption, float offset)
              {
                  Button template = manager.botaoIngles;
                  var button = Object.Instantiate(template, template.transform.parent);
                  button.name = caption;
                  button.onClick = new Button.ButtonClickedEvent();

                  var rect = (RectTransform)button.transform;
                  var last = (RectTransform)manager.botaoChines.transform;
                  rect.anchoredPosition = last.anchoredPosition - new Vector2(0f, offset);
                  var label = button.GetComponent<Text>();
                  label.font = font;
                  label.text = caption;
                  return button;
              }
          }
          CS

          python3 - "$ST1CE_PROJECT" <<'PY'
          from pathlib import Path
          import sys

          project_root = Path(sys.argv[1])
          assets = project_root / "Assets"

          fields = """#if UNITY_IOS
              private Joystick iosMoveStick;
              private Joystick iosLookStick;
              private ST1CECrouch iosCrouch;
          #endif

          """
          init = """#if UNITY_IOS
                  iosMoveStick = ST1CEPortInput.FindStick(uiMover);
                  iosLookStick = ST1CEPortInput.FindStick(uiMoverCamera);
                  iosCrouch = GetComponent<ST1CECrouch>();
                  if (iosCrouch != null)
                      iosCrouch.Initialize(characterController, playerCamera);
                  if (playerCamera != null)
                      rotationX = Mathf.DeltaAngle(0f, playerCamera.transform.localEulerAngles.x);
          #endif
          """

          def change_once(source, old, new, filename):
              if source.count(old) != 1:
                  raise SystemExit(f"{filename}: expected one occurrence of {old!r}")
              return source.replace(old, new, 1)

          def add_ios_body(source, signature, ios_body, filename):
              start = source.find(signature + "\n    {\n")
              if start < 0:
                  raise SystemExit(f"{filename}: cannot locate {signature}")
              begin = start + len(signature + "\n    {\n")
              end = source.find("\n    }", begin)
              if end < 0:
                  raise SystemExit(f"{filename}: cannot locate end of {signature}")
              return source[:begin] + "#if UNITY_IOS\n" + ios_body.rstrip() + "\n#else\n" + source[begin:end] + "\n#endif" + source[end:]

          for relative in ("PlayerControllerMobile.cs", "EnemyControllerMobile.cs", "Sandbox/PlayerSandboxMobile.cs"):
              path = assets / relative
              source = path.read_text(encoding="utf-8-sig", errors="surrogateescape")
              source = change_once(source, "    void Start()\n", fields + "    void Start()\n", relative)
              source = change_once(source, "        characterController = GetComponent<CharacterController>();\n",
                  "        characterController = GetComponent<CharacterController>();\n" + init, relative)

              move = """        bool crouched = iosCrouch != null && iosCrouch.Step();
                  float currentSpeed = crouched ? speed * 0.5f : (run ? sprintSpeed : speed);
                  if (crouched)
                      jump = false;
                  Vector3 move = ST1CEPortInput.GroundDirection(transform, iosMoveStick);
                  ST1CEPortInput.Move(characterController, move * currentSpeed,
                      gravity, jumpHeight, ref velocity, ref jump);"""

              look = """        ST1CEPortInput.Look(transform, playerCamera, iosLookStick, ref rotationX);"""

              if relative.startswith("Sandbox/"):
                  source = add_ios_body(source, "    void NormalMovement()", move, relative)
                  source = add_ios_body(source, "    void HandleCameraRotation()", look, relative)
                  source = add_ios_body(source, "    void NoclipMovement()", """        if (iosCrouch != null)
                  {
                      iosCrouch.Held = false;
                      iosCrouch.Step();
                  }
                  float currentSpeed = run ? sprintSpeed : speed;
                  Vector2 input = ST1CEPortInput.Read(iosMoveStick);
                  Vector3 move = playerCamera.transform.TransformDirection(new Vector3(input.x, 0f, input.y));
                  if (jump)
                      move.y += 1f;
                  jump = false;
                  transform.position += Vector3.ClampMagnitude(move, 1f) * currentSpeed * Time.deltaTime;""", relative)
              else:
                  source = add_ios_body(source, "    void Update()", move + "\n" + look, relative)

              path.write_text(source, encoding="utf-8", errors="surrogateescape")
              print("Connected iOS joystick input:", relative)
          PY

      - name: Set up the Unity license CLI
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Unity and iOS Build Support
        run: |
          set -euo pipefail
          base="https://download.unity3d.com/download_unity/$UNITY_REVISION"
          curl -fLSs --retry 3 --connect-timeout 30 \
            "$base/MacEditorInstaller/Unity-$UNITY_VERSION.pkg" -o "$RUNNER_TEMP/st1ce-editor.pkg"
          sudo installer -pkg "$RUNNER_TEMP/st1ce-editor.pkg" -target /
          rm "$RUNNER_TEMP/st1ce-editor.pkg"
          curl -fLSs --retry 3 --connect-timeout 30 \
            "$base/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-$UNITY_VERSION.pkg" \
            -o "$RUNNER_TEMP/st1ce-ios.pkg"
          sudo installer -pkg "$RUNNER_TEMP/st1ce-ios.pkg" -target /
          rm "$RUNNER_TEMP/st1ce-ios.pkg"

          unity="/Applications/Unity/Unity.app/Contents/MacOS/Unity"
          if [[ ! -x "$unity" ]]; then
            unity="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
          fi
          test -x "$unity"
          printf 'UNITY_EDITOR_PATH=%s\n' "$unity" >> "$GITHUB_ENV"

          xcode='/Applications/Xcode_16.4.app/Contents/Developer'
          if [[ -d "$xcode" ]]; then
            printf 'DEVELOPER_DIR=%s\n' "$xcode" >> "$GITHUB_ENV"
          fi
          df -h "$RUNNER_TEMP"

      - name: Activate Unity Personal
        id: activate
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$UNITY_USERNAME" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Set UNITY_USERNAME and UNITY_PASSWORD in Actions secrets."
            exit 1
          fi
          npm install --global @rage-against-the-pixel/unity-cli@4.2.2
          unity-cli activate-license --license personal

      - name: Export all original enabled scenes from Unity
        timeout-minutes: 105
        run: |
          set -euo pipefail
          mkdir -p logs
          "$UNITY_EDITOR_PATH" -batchmode -nographics -quit -projectPath "$ST1CE_PROJECT" \
            -buildTarget iOS -executeMethod ST1CEIOSExport.Run -logFile - \
            2>&1 | tee logs/unity.log
          test -d "$ST1CE_XCODE/Unity-iPhone.xcodeproj"

      - name: Compile and package the unsigned arm64 IPA
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/st1ce-derived"
          package="$RUNNER_TEMP/st1ce-package"
          mkdir -p dist "$package/Payload"
          xcodebuild -version | tee logs/xcode-version.log
          xcodebuild -project "$ST1CE_XCODE/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath "$derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee logs/xcode.log

          shopt -s nullglob
          apps=("$derived/Build/Products/Release-iphoneos/"*.app)
          [[ "${#apps[@]}" -eq 1 ]]
          app="${apps[0]}"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          xcrun lipo "$app/$executable" -verify_arch arm64
          ditto "$app" "$package/Payload/ST1CERemaster.app"
          cp logs/Noto-OFL.txt "$package/Payload/ST1CERemaster.app/Noto-OFL.txt"
          ditto -c -k --keepParent "$package/Payload" "$PWD/dist/ST1-CE-Remaster.ipa"
          unzip -tq dist/ST1-CE-Remaster.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: ST1-CE-Remaster-iOS
          path: dist/ST1-CE-Remaster.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ST1-CE-Build-Logs
          path: logs
          if-no-files-found: ignore

      - name: Return the Unity license
        if: always() && steps.activate.outcome == 'success'
        run: unity-cli return-license --license personal
