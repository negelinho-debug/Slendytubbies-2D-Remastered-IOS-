
name: Odio el Chocolate iOS Fix 2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare folders
        run: mkdir -p logs recovered output

      - name: Download recovered Unity project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID=$(gh run list \
            --workflow odio-recover.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          test -n "$RUN_ID"

          gh run download "$RUN_ID" \
            --name Odio-el-Chocolate-Recovery \
            --dir recovered

          tar -xzf recovered/Odio-Unity-Project.tar.gz

          test -d ExportedProject/Assets
          test -s recovered/Assembly-CSharp-original.dll

      - name: Check original game
        run: |
          set -euo pipefail

          find ExportedProject/Assets \
            -name '*.unity' | tee logs/scenes.txt

          find ExportedProject/Assets \
            -name '*.dll' | tee logs/assemblies.txt

          test -f ExportedProject/Assets/Scene/MainMenu.unity
          test -f ExportedProject/Assets/Scene/School.unity

          test -f ExportedProject/Assets/Plugins/Assembly-CSharp.dll

      - name: Fix 1 - Remove unused UNET library
        run: |
          set -euo pipefail

          python3 - <<'PY' | tee logs/unet-fix.log
          from pathlib import Path

          assets = Path("ExportedProject/Assets")
          legacy = "com.unity.multiplayer-hlapi.Runtime"

          game = Path(
              "recovered/Assembly-CSharp-original.dll"
          ).read_bytes()

          for ref in [
              b"UnityEngine.Networking",
              b"UnityEngine.UNETModule",
              legacy.encode()
          ]:
              if ref in game:
                  raise SystemExit(
                      "Original game has networking dependencies"
                  )

          for plugin in assets.rglob(legacy + ".dll"):
              for dll in assets.rglob("*.dll"):
                  if dll != plugin:
                      if legacy.encode() in dll.read_bytes():
                          raise SystemExit(
                              "Dependency found: " + str(dll)
                          )

              print("Removing unused library:", plugin)
              plugin.unlink()

              meta = Path(str(plugin) + ".meta")

              if meta.exists():
                  meta.unlink()

          print("UNET fix completed")
          PY

      - name: Fix 2 - Prepare modern TextMeshPro
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/odio-python"

          "$RUNNER_TEMP/odio-python/bin/pip" \
            install pycryptodome

          echo "ODIO_PYTHON=$RUNNER_TEMP/odio-python/bin/python" \
            >> "$GITHUB_ENV"

          mkdir -p compatibility

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          project = Path("ExportedProject")
          assets = project / "Assets"

          info = {}

          for name in [
              "Unity.TextMeshPro.dll",
              "UnityEngine.UI.dll"
          ]:
              matches = list(assets.rglob(name))

              if len(matches) > 1:
                  raise SystemExit(
                      "Multiple copies found: " + name
                  )

              for dll in matches:
                  meta = Path(str(dll) + ".meta")

                  if not meta.exists():
                      raise SystemExit(
                          "Missing metadata: " + str(dll)
                      )

                  guid = re.search(
                      r"(?m)^guid:\s*([a-f0-9]+)",
                      meta.read_text()
                  )

                  if not guid:
                      raise SystemExit("GUID missing")

                  info[name] = guid.group(1)

                  shutil.copy2(
                      dll,
                      Path("compatibility") / name
                  )

                  shutil.copy2(
                      meta,
                      Path("compatibility") / meta.name
                  )

                  dll.unlink()
                  meta.unlink()

                  print(
                      "Legacy plugin backed up:",
                      name,
                      guid.group(1)
                  )

          Path("compatibility/legacy-guids.json").write_text(
              json.dumps(info, indent=2)
          )

          manifest = project / "Packages/manifest.json"
          manifest.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          data = (
              json.loads(manifest.read_text())
              if manifest.exists()
              else {"dependencies": {}}
          )

          deps = data.setdefault("dependencies", {})

          deps.pop("com.unity.textmeshpro", None)
          deps.pop("com.unity.multiplayer-hlapi", None)

          deps["com.unity.ugui"] = "2.0.0"

          manifest.write_text(
              json.dumps(data, indent=2)
          )

          lock = project / "Packages/packages-lock.json"

          if lock.exists():
              lock.unlink()

          print("Modern UI package configured")
          PY

      - name: Install Unity and iOS support
        timeout-minutes: 40
        run: |
          set -euo pipefail

          test "$(uname -m)" = arm64

          BASE=https://download.unity3d.com/download_unity/feeafc12a938

          curl -fL --retry 3 \
            "$BASE/MacEditorInstallerArm64/Unity-6000.4.10f1.pkg" \
            -o "$RUNNER_TEMP/unity.pkg"

          sudo installer \
            -pkg "$RUNNER_TEMP/unity.pkg" \
            -target / | tee logs/unity-install.log

          rm -f "$RUNNER_TEMP/unity.pkg"

          curl -fL --retry 3 \
            "$BASE/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-6000.4.10f1.pkg" \
            -o "$RUNNER_TEMP/ios.pkg"

          sudo installer \
            -pkg "$RUNNER_TEMP/ios.pkg" \
            -target / | tee -a logs/unity-install.log

          rm -f "$RUNNER_TEMP/ios.pkg"

          UNITY=$(find /Applications \
            -path '*/Unity.app/Contents/MacOS/Unity' \
            -type f 2>/dev/null \
            | grep '6000.4.10f1' \
            | head -n 1 || true)

          test -x "$UNITY"

          echo "UNITY_EDITOR=$UNITY" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Activate Unity Personal
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME || secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          npm install -g @rage-against-the-pixel/unity-cli@4.2.2

          unity-cli activate-license --license personal

      - name: Resolve modern Unity packages
        timeout-minutes: 25
        run: |
          set -euo pipefail

          "$UNITY_EDITOR" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$PWD/ExportedProject" \
            -logFile "$PWD/logs/package-import.log"

      - name: Fix 2 - Restore UI script references
        run: |
          set -euo pipefail

          "$ODIO_PYTHON" - <<'PY' | tee logs/ui-remap.log
          from pathlib import Path
          from Crypto.Hash import MD4
          import json
          import struct
          import re

          project = Path("ExportedProject")

          old = json.loads(
              Path(
                  "compatibility/legacy-guids.json"
              ).read_text()
          )

          cache = project / "Library/PackageCache"

          package_dirs = list(
              cache.glob("com.unity.ugui@*")
          )

          package_dirs += list(
              cache.glob("com.unity.textmeshpro@*")
          )

          package_dirs += [
              project / "Packages/com.unity.ugui",
              project / "Packages/com.unity.textmeshpro"
          ]

          package_dirs = [
              p for p in package_dirs if p.is_dir()
          ]

          if not package_dirs:
              raise SystemExit(
                  "Modern UI package not found"
              )

          def script_file_id(namespace, name):
              md = MD4.new()

              md.update(
                  b"s\x00\x00\x00" +
                  (namespace + name).encode("utf-8")
              )

              return struct.unpack(
                  "<i",
                  md.digest()[:4]
              )[0]

          mapping = {}

          for package in package_dirs:
              for source in package.rglob("*.cs"):
                  meta = Path(str(source) + ".meta")

                  if not meta.exists():
                      continue

                  namespace_match = re.search(
                      r"\bnamespace\s+([\w.]+)",
                      source.read_text(
                          errors="ignore"
                      )
                  )

                  if not namespace_match:
                      continue

                  namespace = namespace_match.group(1)

                  if namespace == "TMPro":
                      assembly = "Unity.TextMeshPro.dll"
                  elif namespace.startswith("UnityEngine.UI"):
                      assembly = "UnityEngine.UI.dll"
                  elif namespace.startswith("UnityEngine.EventSystems"):
                      assembly = "UnityEngine.UI.dll"
                  else:
                      continue

                  if assembly not in old:
                      continue

                  guid_match = re.search(
                      r"(?m)^guid:\s*([a-f0-9]+)",
                      meta.read_text(
                          errors="ignore"
                      )
                  )

                  if not guid_match:
                      continue

                  old_id = script_file_id(
                      namespace,
                      source.stem
                  )

                  mapping[
                      (old[assembly], old_id)
                  ] = guid_match.group(1)

          pattern = re.compile(
              r"fileID:\s*(-?\d+),\s*"
              r"guid:\s*([a-f0-9]+),\s*type:\s*3"
          )

          count = 0
          unresolved = set()

          for asset in (
              project / "Assets"
          ).rglob("*"):

              if asset.suffix not in [
                  ".unity",
                  ".prefab",
                  ".asset",
                  ".mat"
              ]:
                  continue

              if not asset.is_file():
                  continue

              try:
                  content = asset.read_text()
              except UnicodeDecodeError:
                  continue

              def replace(match):
                  global count

                  file_id = int(match.group(1))
                  guid = match.group(2)

                  if guid not in old.values():
                      return match.group(0)

                  key = (guid, file_id)

                  if key not in mapping:
                      unresolved.add(key)
                      return match.group(0)

                  count += 1

                  return (
                      "fileID: 11500000, guid: " +
                      mapping[key] +
                      ", type: 3"
                  )

              result = pattern.sub(
                  replace,
                  content
              )

              if result != content:
                  asset.write_text(result)

          print("Available script mappings:", len(mapping))
          print("Restored references:", count)
          print("Unresolved references:", len(unresolved))

          for item in sorted(unresolved):
              print("Unresolved:", item)

          if unresolved:
              raise SystemExit(
                  "Some UI references require migration"
              )

          print("TextMeshPro migration completed")
          PY

      - name: Prepare iOS build script
        run: |
          mkdir -p ExportedProject/Assets/Editor

          cat > ExportedProject/Assets/Editor/OdioIOSBuild.cs <<'EOF'
          using UnityEngine;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using System;
          using System.IO;
          using System.Linq;

          public static class OdioIOSBuild
          {
              public static void Export()
              {
                  AssetDatabase.Refresh();

                  string[] scenes = {
                      "Assets/Scene/Warning.unity",
                      "Assets/Scene/MainMenu.unity",
                      "Assets/Scene/School.unity",
                      "Assets/Scene/GameOver.unity",
                      "Assets/Scene/Results.unity",
                      "Assets/Scene/Secret.unity",
                      "Assets/Scene/TestRoom.unity"
                  };

                  foreach (string scene in scenes)
                  {
                      if (!File.Exists(scene))
                          throw new Exception(
                              "Missing scene: " + scene
                          );
                  }

                  EditorBuildSettings.scenes = scenes
                      .Select(s =>
                          new EditorBuildSettingsScene(
                              s, true
                          )
                      )
                      .ToArray();

                  PlayerSettings.productName =
                      "Odio el Chocolate";

                  PlayerSettings.companyName =
                      "Odio Mobile";

                  PlayerSettings.SetApplicationIdentifier(
                      BuildTargetGroup.iOS,
                      "com.odio.chocolate.ios"
                  );

                  PlayerSettings.bundleVersion = "1.0.2";
                  PlayerSettings.iOS.buildNumber = "3";

                  PlayerSettings.iOS.targetOSVersionString =
                      "15.0";

                  PlayerSettings.defaultInterfaceOrientation =
                      UIOrientation.LandscapeLeft;

                  PlayerSettings.SetScriptingBackend(
                      BuildTargetGroup.iOS,
                      ScriptingImplementation.IL2CPP
                  );

                  PlayerSettings.SetManagedStrippingLevel(
                      BuildTargetGroup.iOS,
                      ManagedStrippingLevel.Minimal
                  );

                  PlayerSettings.iOS.appleEnableAutomaticSigning =
                      false;

                  string destination =
                      Environment.GetEnvironmentVariable(
                          "ODIO_XCODE"
                      );

                  BuildPlayerOptions options =
                      new BuildPlayerOptions
                  {
                      scenes = scenes,
                      locationPathName = destination,
                      target = BuildTarget.iOS,
                      options = BuildOptions.None
                  };

                  BuildReport report =
                      BuildPipeline.BuildPlayer(options);

                  foreach (var step in report.steps)
                  {
                      foreach (var message in step.messages)
                      {
                          if (message.type == LogType.Error ||
                              message.type == LogType.Exception)
                          {
                              Debug.LogError(message.content);
                          }
                      }
                  }

                  if (report.summary.result !=
                      BuildResult.Succeeded)
                  {
                      throw new Exception(
                          "iOS export failed: " +
                          report.summary.result
                      );
                  }

                  Debug.Log("Odio Fix 2 export successful");
              }
          }
          EOF

      - name: Add diagnostic logger
        run: |
          mkdir -p ExportedProject/Assets/OdioMobile

          cat > ExportedProject/Assets/OdioMobile/OdioLogger.cs <<'EOF'
          using UnityEngine;
          using UnityEngine.SceneManagement;
          using System;
          using System.IO;

          public static class OdioLogger
          {
              private static string path;

              [RuntimeInitializeOnLoadMethod(
                  RuntimeInitializeLoadType.BeforeSceneLoad)]
              private static void Init()
              {
                  path = Path.Combine(
                      Application.persistentDataPath,
                      "odio-ios-log.txt"
                  );

                  Write("Odio el Chocolate iOS Fix 2");
                  Write("Device: " + SystemInfo.deviceModel);
                  Write("Unity: " + Application.unityVersion);

                  Application.logMessageReceived += OnLog;

                  SceneManager.sceneLoaded += (scene, mode) =>
                      Write("Scene loaded: " + scene.name);
              }

              private static void OnLog(
                  string message,
                  string stack,
                  LogType type)
              {
                  Write(type + ": " + message);

                  if (type == LogType.Exception ||
                      type == LogType.Error)
                  {
                      Write(stack);
                  }
              }

              private static void Write(string message)
              {
                  try
                  {
                      File.AppendAllText(
                          path,
                          DateTime.Now + " " +
                          message + "\n"
                      );
                  }
                  catch {}
              }
          }
          EOF

      - name: Preserve original game code
        run: |
          cat > ExportedProject/Assets/link.xml <<'EOF'
          <linker>
            <assembly fullname="Assembly-CSharp" preserve="all"/>
            <assembly fullname="Unity.TextMeshPro" preserve="all"/>
            <assembly fullname="UnityEngine.UI" preserve="all"/>
          </linker>
          EOF

      - name: Export Unity project to Xcode
        timeout-minutes: 45
        run: |
          set -euo pipefail

          export ODIO_XCODE="$PWD/ios-export"

          if ! "$UNITY_EDITOR" \
            -batchmode \
            -nographics \
            -quit \
            -buildTarget iOS \
            -projectPath "$PWD/ExportedProject" \
            -executeMethod OdioIOSBuild.Export \
            -logFile "$PWD/logs/unity-export.log"; then

            grep -Ei \
              'error|exception|failed to resolve' \
              logs/unity-export.log \
              | cut -c1-1000 \
              | tail -n 100 || true

            tail -n 100 logs/unity-export.log

            exit 1
          fi

          test -s ios-export/Unity-iPhone.xcodeproj/project.pbxproj

      - name: Enable diagnostic file sharing
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          p = Path("ios-export/Info.plist")

          if p.exists():
              with p.open("rb") as f:
                  data = plistlib.load(f)

              data["UIFileSharingEnabled"] = True

              data[
                  "LSSupportsOpeningDocumentsInPlace"
              ] = True

              with p.open("wb") as f:
                  plistlib.dump(data, f)
          PY

      - name: Build iOS application
        timeout-minutes: 45
        run: |
          set -euo pipefail

          if ! xcodebuild \
            -project ios-export/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/derived" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > logs/xcodebuild.log 2>&1; then

            grep -Ei 'error:|fatal error' \
              logs/xcodebuild.log \
              | tail -n 80 || true

            tail -n 150 logs/xcodebuild.log

            exit 1
          fi

      - name: Create IPA
        run: |
          set -euo pipefail

          APP=$(find derived/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name '*.app' \
            -print -quit)

          test -n "$APP"
          test -d "$APP"

          EXE=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$APP/Info.plist")

          xcrun lipo "$APP/$EXE" -verify_arch arm64

          mkdir -p package/Payload

          cp -R "$APP" package/Payload/Odio.app

          (
            cd package

            zip -qry \
              ../output/Odio-el-Chocolate-iOS-Fix2.ipa \
              Payload
          )

          test -s output/Odio-el-Chocolate-iOS-Fix2.ipa

          ls -lh output/

          echo "Fix 2 IPA created" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Odio-el-Chocolate-iOS-Fix2
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Odio-iOS-Fix2-Logs
          path: |
            logs/
            compatibility/
          retention-days: 14
